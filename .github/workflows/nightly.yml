name: nightly

# Runs every scenario against both implementations, for both pairs, and records the
# verdict.
#
# The MATLAB side needs a licence, so this cannot run per-PR;
# matlab-actions/setup-matlab is licence-free only for public repositories, which
# is why this repo has to stay public.
#
# Nothing is compared unless a pair's own two sides actually moved: nightly/state.json
# (raven) and nightly/gecko-state.json (gecko) hold the revisions of each pair's last
# real run, and an unchanged pair means the answer is already on disk. Re-running an
# hour of MATLAB to reprint yesterday's table teaches nobody anything.
#
# The gecko pair is a four-repo job, not two: GECKO depends on RAVEN on the MATLAB
# path, and geckopy depends on raven-toolbox (not yet on PyPI, pinned to a git ref) on
# the Python side. Installing geckopy from its own metadata would pull raven-toolbox's
# ref directly rather than the checkout this job already resolved, so raven-toolbox is
# installed first from that checkout and geckopy is installed with --no-deps on top of
# it --- see "Point parity at the checked-out repos" below.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario id (blank = all)"
        required: false
      force:
        description: "Run even if neither side of the pair has moved"
        type: boolean
        default: false

# The report is committed back, so the run needs write access to this repo.
permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One pair at a time: both entries commit nightly/ back to this repo, and a
      # concurrent push from the other entry would race it. Nightly has no latency
      # requirement, so running sequentially is the simple fix rather than the fast one.
      max-parallel: 1
      matrix:
        pair: [raven, gecko]
        include:
          - pair: raven
            report_path: nightly/report.md
            state_path: nightly/state.json
          - pair: gecko
            report_path: nightly/gecko-report.md
            state_path: nightly/gecko-state.json
    steps:
      # ref: develop, not the default github.sha: for a schedule-triggered run,
      # github.sha is fixed once for the whole run and shared by both matrix
      # jobs. With max-parallel: 1 the raven entry runs first and pushes its
      # own report commit mid-run, advancing develop -- but the gecko entry's
      # checkout would still resolve to that same stale pre-run sha, making
      # its own push a guaranteed non-fast-forward rejection. Pinning to the
      # branch name instead makes each job's checkout fetch develop's actual
      # current tip at the moment it runs.
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      # parity.toml is the single source of truth for which branch each side is
      # compared at --- RAVEN's default branch is `main`, but the ledger describes
      # `develop3`. RAVEN's own repo/ref is resolved unconditionally: the gecko entry
      # needs it as a MATLAB-path and geckopy-install dependency even though it is not
      # the pair under test there.
      - id: refs
        run: |
          eval "$(parity refs --pair raven --format shell)"
          echo "raven_matlab_repo=$raven_matlab_repo" >> "$GITHUB_OUTPUT"
          echo "raven_matlab_ref=$raven_matlab_ref" >> "$GITHUB_OUTPUT"
          echo "raven_python_repo=$raven_python_repo" >> "$GITHUB_OUTPUT"
          echo "raven_python_ref=$raven_python_ref" >> "$GITHUB_OUTPUT"

          eval "$(parity refs --pair ${{ matrix.pair }} --format shell)"
          echo "matlab_repo=${${{ matrix.pair }}_matlab_repo}" >> "$GITHUB_OUTPUT"
          echo "matlab_ref=${${{ matrix.pair }}_matlab_ref}" >> "$GITHUB_OUTPUT"
          echo "python_repo=${${{ matrix.pair }}_python_repo}" >> "$GITHUB_OUTPUT"
          echo "python_ref=${${{ matrix.pair }}_python_ref}" >> "$GITHUB_OUTPUT"

      - id: state
        name: Has this pair moved since its last run?
        run: |
          matlab_sha=$(git ls-remote "https://github.com/${{ steps.refs.outputs.matlab_repo }}.git" \
            "refs/heads/${{ steps.refs.outputs.matlab_ref }}" | cut -f1)
          python_sha=$(git ls-remote "https://github.com/${{ steps.refs.outputs.python_repo }}.git" \
            "refs/heads/${{ steps.refs.outputs.python_ref }}" | cut -f1)
          raven_matlab_sha=$(git ls-remote "https://github.com/${{ steps.refs.outputs.raven_matlab_repo }}.git" \
            "refs/heads/${{ steps.refs.outputs.raven_matlab_ref }}" | cut -f1)
          raven_python_sha=$(git ls-remote "https://github.com/${{ steps.refs.outputs.raven_python_repo }}.git" \
            "refs/heads/${{ steps.refs.outputs.raven_python_ref }}" | cut -f1)
          if [ -z "$matlab_sha" ] || [ -z "$python_sha" ] || [ -z "$raven_matlab_sha" ] || [ -z "$raven_python_sha" ]; then
            echo "could not resolve one of the tracked branches" >&2
            exit 1
          fi
          echo "matlab_sha=$matlab_sha" >> "$GITHUB_OUTPUT"
          echo "python_sha=$python_sha" >> "$GITHUB_OUTPUT"
          echo "raven_matlab_sha=$raven_matlab_sha" >> "$GITHUB_OUTPUT"
          echo "raven_python_sha=$raven_python_sha" >> "$GITHUB_OUTPUT"

          previous="none none"
          if [ -f "${{ matrix.state_path }}" ]; then
            previous=$(python -c "
          import json
          state = json.load(open('${{ matrix.state_path }}'))['revisions']
          print(state.get('${{ matrix.pair }}.matlab', 'none'), state.get('${{ matrix.pair }}.python', 'none'))
          ")
          fi
          if [ "$previous" = "$matlab_sha $python_sha" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "unchanged: $previous"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # RAVEN and raven-toolbox: needed by both entries, as the pair under test for
      # raven and as a MATLAB-path / geckopy-install dependency for gecko.
      - uses: actions/checkout@v4
        if: steps.state.outputs.changed == 'true'
        with:
          repository: ${{ steps.refs.outputs.raven_matlab_repo }}
          ref: ${{ steps.state.outputs.raven_matlab_sha }}
          path: repos/RAVEN
      - uses: actions/checkout@v4
        if: steps.state.outputs.changed == 'true'
        with:
          repository: ${{ steps.refs.outputs.raven_python_repo }}
          ref: ${{ steps.state.outputs.raven_python_sha }}
          path: repos/raven-toolbox

      # GECKO and geckopy: only the gecko entry needs these.
      - uses: actions/checkout@v4
        if: steps.state.outputs.changed == 'true' && matrix.pair == 'gecko'
        with:
          repository: ${{ steps.refs.outputs.matlab_repo }}
          ref: ${{ steps.state.outputs.matlab_sha }}
          path: repos/GECKO
      - uses: actions/checkout@v4
        if: steps.state.outputs.changed == 'true' && matrix.pair == 'gecko'
        with:
          repository: ${{ steps.refs.outputs.python_repo }}
          ref: ${{ steps.state.outputs.python_sha }}
          path: repos/geckopy

      - name: Point parity at the checked-out repos
        if: steps.state.outputs.changed == 'true'
        run: |
          cat > parity.local.toml <<'EOF'
          [pairs.raven.matlab]
          path = "repos/RAVEN"
          [pairs.raven.python]
          path = "repos/raven-toolbox"
          EOF
          pip install "./repos/raven-toolbox[excel]"
          # gurobipy registers "gurobi" as a solver interface with cobra/optlang; the
          # Gurobi licence step below only provisions the licence file, which does
          # nothing if the package itself was never installed. raven-toolbox's own
          # parity-nightly.yml uses this exact same GUROBI_EDUARD secret this way
          # already, successfully, every day.
          pip install gurobipy

          if [ "${{ matrix.pair }}" = "gecko" ]; then
            cat >> parity.local.toml <<'EOF'
          [pairs.gecko.matlab]
          path = "repos/GECKO"
          [pairs.gecko.python]
          path = "repos/geckopy"
          EOF
            # --no-deps: geckopy's own metadata pins raven-toolbox to a git ref, which
            # would otherwise override the pinned checkout just installed above with
            # whatever that ref currently resolves to. Its other dependencies still need
            # installing, so they are read out of its own pyproject.toml (skipping the
            # raven-toolbox entry) rather than duplicated here by hand, which would
            # silently drift out of sync as geckopy's dependencies change.
            pip install --no-deps ./repos/geckopy
            python -c "
          import tomllib
          with open('repos/geckopy/pyproject.toml', 'rb') as f:
              deps = tomllib.load(f)['project']['dependencies']
          print('\n'.join(d for d in deps if not d.strip().startswith('raven-toolbox')))
          " > geckopy-deps.txt
            pip install -r geckopy-deps.txt
          fi

      - uses: matlab-actions/setup-matlab@v2
        if: steps.state.outputs.changed == 'true'
        with:
          release: R2024b

      # Scenarios that need a MILP solver read this; the ones that do not ignore it.
      #
      # Two shapes are accepted because two exist in the organisation: GUROBI_EDUARD
      # is an organisation secret holding a licence file verbatim, and the three-field
      # form is what raven-toolbox's parity-nightly workflow was written against.
      # Preferring one and failing on the other would make this job's health depend on
      # which of the two somebody happened to configure.
      #
      # A missing licence is a notice, not an error: most scenarios are solver-free,
      # and losing all of them because one needs Gurobi would be the wrong trade.
      - name: Gurobi licence
        if: steps.state.outputs.changed == 'true'
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: |
          umask 077
          licence="$HOME/gurobi.lic"
          if [ -n "$LICENCE_FILE" ]; then
            printf '%s\n' "$LICENCE_FILE" > "$licence"
          elif [ -n "$WLSACCESSID" ] && [ -n "$WLSSECRET" ] && [ -n "$LICENSEID" ]; then
            { echo "WLSACCESSID=$WLSACCESSID"
              echo "WLSSECRET=$WLSSECRET"
              echo "LICENSEID=$LICENSEID"
            } > "$licence"
          else
            echo "::notice::no Gurobi licence configured; solver-dependent scenarios will fail"
            exit 0
          fi

          # Report the shape without printing the value. A named-user academic licence
          # is tied to one machine and cannot authenticate on a hosted runner, so
          # finding one here explains a failure that otherwise looks like a solver bug.
          if grep -q '^[[:space:]]*WLSACCESSID=' "$licence"; then
            echo "Gurobi WLS licence installed"
          else
            echo "::warning::the configured licence is not a WLS licence. A named-user" \
                 "licence is tied to a specific machine and will not authenticate on a" \
                 "hosted runner; solver-dependent scenarios will fail."
          fi
          echo "GRB_LICENSE_FILE=$licence" >> "$GITHUB_ENV"

      # The licence alone gets Python working (gurobipy bundles Gurobi's own runtime),
      # but RAVEN calls a plain MATLAB function, gurobi(prob, params) -- that comes from
      # Gurobi's MATLAB interface, which ships only inside the full optimizer
      # distribution, not as anything setup-matlab or a licence file provides.
      # packages.gurobi.com's versioned tarballs are plain, unauthenticated downloads
      # (the licence is what gates solving, not fetching the software); MATLABPATH is
      # picked up by MATLAB at startup, so nothing about the per-scenario matlab_side.m
      # generated below needs to change.
      - name: Install Gurobi's MATLAB interface
        if: steps.state.outputs.changed == 'true'
        run: |
          curl -fsSL https://packages.gurobi.com/13.0/gurobi13.0.3_linux64.tar.gz -o gurobi.tar.gz
          tar -xzf gurobi.tar.gz
          echo "LD_LIBRARY_PATH=$PWD/gurobi1303/linux64/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "MATLABPATH=$PWD/gurobi1303/linux64/matlab" >> "$GITHUB_ENV"

      # A scenario that crashes must not stop the others: the report distinguishes a
      # missing result from a matching one, so a crash is recorded, not hidden.
      - id: scenarios
        name: Run the Python side, and stage the MATLAB side
        if: steps.state.outputs.changed == 'true'
        continue-on-error: true
        run: |
          : > matlab_side.m
          for id in $(parity scenarios --pair ${{ matrix.pair }} | awk 'NR % 2 == 1 {print $1}'); do
            if [ -n "${{ inputs.scenario }}" ] && [ "$id" != "${{ inputs.scenario }}" ]; then
              continue
            fi
            echo "::group::$id"
            parity run "$id" --impl python || echo "::warning::$id failed on python"
            # `parity prepare` writes the context file and prints the statement
            # rather than running it. MATLAB has to be started by the action
            # below, not by us -- see the licensing note there.
            parity prepare "$id" --guard >> matlab_side.m || echo "::warning::$id not prepared"
            echo "::endgroup::"
          done
          cat matlab_side.m

      # MATLAB must be started by this action, not by us. MathWorks licenses
      # public repositories only through run-command / run-tests / run-build;
      # setup-matlab merely installs it, so a `matlab -batch` we spawn ourselves
      # dies with "License Manager Error -1" no matter how public the repo is.
      #
      # One invocation for every scenario, because each one costs a MATLAB start.
      - name: Run the MATLAB side
        if: steps.state.outputs.changed == 'true'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: "run('matlab_side.m')"

      - name: Collect the MATLAB results
        if: steps.state.outputs.changed == 'true'
        continue-on-error: true
        run: |
          for id in $(parity scenarios --pair ${{ matrix.pair }} | awk 'NR % 2 == 1 {print $1}'); do
            if [ -n "${{ inputs.scenario }}" ] && [ "$id" != "${{ inputs.scenario }}" ]; then
              continue
            fi
            parity collect "$id" || echo "::warning::$id produced no matlab result"
          done

      - id: report
        name: Render the report
        if: steps.state.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python scripts/nightly_report.py \
            --pair ${{ matrix.pair }} \
            --state "${{ matrix.state_path }}" \
            --report "${{ matrix.report_path }}" \
            --stamp "$(date -u +%Y-%m-%d)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "${{ matrix.pair }}.matlab=${{ steps.state.outputs.matlab_sha }}" \
            --sha "${{ matrix.pair }}.python=${{ steps.state.outputs.python_sha }}"

      # Committed rather than left as an artefact: an artefact expires and nobody
      # browses old runs, so a report that lives only there is a report nobody reads.
      - name: Commit the report
        if: steps.state.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightly/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "nightly: ${{ matrix.pair }} parity report for $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.state.outputs.changed == 'true'
        with:
          name: scenario-results-${{ matrix.pair }}
          path: |
            results/
            nightly/

      - name: Fail if the two implementations disagree
        if: steps.state.outputs.changed == 'true' && steps.report.outcome != 'success'
        run: |
          echo "see ${{ matrix.report_path }}" >&2
          exit 1
