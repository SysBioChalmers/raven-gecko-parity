    scenarios:
      - okp_kcat_ectestgem
    notes: 'build_okp_input_csv builds the identical CSV shape (header "Protein Sequence,Substrate", one row
      per enzyme/substrate pair) via the same shared extraction helper both sides reuse from their DLKcat
