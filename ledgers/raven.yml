      rxn.lower_bound/rxn.upper_bound literally (confirmed by reading raven_toolbox/io/excel.py in full). This is
      not a corner case: smallYeast declares defaultLB=-1000/defaultUB=1000, and every one of its bounds is drawn
      from exactly {-1000, 0, 1000} --- checked directly --- so nearly every reaction hits one of RAVEN''s hiding
      rules. Of five representative reactions tested, three (PGI, FBA --- reversible, at the default; HXK ---
      irreversible, at 0/default) come back fully blank from RAVEN and fully populated with literal numbers from
