id: sensitivity_tuning_ectestgem
pair: gecko
description: >-
  Automated kcat and sigma tuning on ecTestGEM's ecModel (sensitivityTuning,
  sigmaFitter), plus the solver-free table utility that shares their source
  folder (truncateValues).

entries:
  - sensitivityTuning
  - sigmaFitter
  - truncateValues

# The fourth scenario in this pair that needs an LP solver (sensitivityTuning,
# sigmaFitter); truncateValues is pure data manipulation and needs neither a
# solver nor an ecModel, so its checkpoint builds nothing beyond a small
# hand-written fixture.
inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  matlab_solver: gurobi
  python_solver: gurobi

  # R2 and R4 blocked, R3 left as the sole m1->m2 route: the same fixture shape
  # enzyme_usage_ectestgem and flexibilize_concs_ectestgem both reuse, for the same
  # reason -- a single, unambiguous catalysed route removes any risk of the two
  # sides picking a different "most limiting" reaction at some step along an
  # iterative loop.
  bio_rxn: R5

  # sensitivityTuning: kcat_R3 deliberately far too low for the desired growth rate,
  # so the loop has real, multi-iteration work to do. Confirmed by direct execution:
  # bumped exactly once (foldChange=10 applied twice --- iteration 1 doesn't reach the
  # target, iteration 2 does), R3/P4 both times, matching exactly between MATLAB and
  # geckopy. geckopy's own MATLAB-COMPAT note in sensitivity_tuning.py describes
  # MATLAB as picking the *reverse*-direction usage reaction with the most *negative*
  # flux ("MATLAB picks min(drawFluxes)") --- stale relative to the GECKO develop4 this
  # scenario runs against: protein usage/pool reactions were switched to the forward
  # direction in GECKO#419, after which MATLAB's own drawFluxes are non-negative and
  # its code already reads `[~,sel] = max(drawFluxes)`, the same choice geckopy makes.
  # Confirmed matching by direct execution, not merely by re-reading both sources.
  sens_kcats:
    R3: 0.05
    R5: 200.0
  sens_desired_growth: 50.0

  # sigmaFitter: a completely separate kcat/model instance from sensitivityTuning
  # above (its own fixture, not fed the tuned kcats), sized so the fitted sigma is
  # comfortably inside (0, 1) rather than landing on a boundary.
  sigma_kcats:
    R3: 5.0
    R5: 200.0
  sigma_growth_rate: 100.0
  sigma_p_tot: 0.5
  sigma_f: 4.0

  # truncateValues: one value per order-of-magnitude regime the function's own
  # docstring describes, plus a negative value, plus a value small enough to round
  # away to exactly zero under the "6 decimal places when order_magn=0" edge of the
  # rounding rule (0 and NaN both fall through unchanged on both sides; this value
  # rounds *to* zero, which is different and worth covering).
  truncate_values:
    - 0.0
    - 1.234567891
    - 123.456789
    - 0.000123456789
    - 1234567.891
    - -55.5555555
    - 1.0e-8

# One confirmed divergence, found by direct execution rather than assumed from either
# side's comments:
#
# sigmaFitter --- a genuine MATLAB bug, not a design choice: the 100-point grid-search
# loop reassigns `model` on every iteration, so by the time it ends the returned model's
# protein pool is sized for whichever sigma was tried *last* (sigma=1), not the
# best-fitting sigma the function actually returns as its own second output. geckopy's
# own MATLAB-COMPAT note already flags this; confirmed here with the actual numbers on
# this fixture (returned sigma 0.11 on both sides; MATLAB's returned model pool bound
# 2000, geckopy's 220 = Ptot*f*0.11*1000, the value at the *returned* sigma). Filed and
# fixed: [GECKO #433]. This scenario's model-state checkpoint will read as matching
# once that merges rather than needing a code change here.
tolerance:
  rel: 1.0e-6
  abs: 1.0e-9
