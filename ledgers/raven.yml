# Parity ledger --- raven
#
# One row per public function on either side. `parity check` fails if a public
# function is missing here, or if a row names something that no longer exists.
#
# status:
#   parity          Both sides implement this and are intended to behave the same.
#   python-pending  MATLAB has it; a Python port is queued.
#   matlab-pending  Python has it; a MATLAB back-port is queued.
#   matlab-only     Deliberately MATLAB-only --- not coming to Python.
#   python-only     Deliberately Python-only --- not going to MATLAB.
#   via-dependency  The other side gets this from a dependency (cobrapy, COBRA Toolbox) instead.
#   subsumed        The other side has the capability inside another function, not as its own entry point.
#   internal        Not part of the cross-implementation API (glue, installers, helpers).
#   unreviewed      Not yet triaged. Drive this count to zero.
#
# Regenerate the human-readable view with: parity report --pair raven

version: 1
pair: raven
matlab: SysBioChalmers/RAVEN
python: SysBioChalmers/raven-toolbox

entries:
  - matlab: addExchangeRxns
    status: via-dependency
    reason: 'cobrapy covers this: model.add_boundary(metabolite, type=''exchange'').'
  - matlab: addGenesRaven
    status: via-dependency
    reason: 'cobrapy covers this: genes are created automatically from a reaction''s GPR.'
  - matlab: addIdentifierPrefix
    status: python-pending
    notes: Adds an SBML-safe prefix to model identifiers. No port decision is recorded either way. Left in
      the queue rather than declared a divergence, so the choice stays visible.
  - matlab: addMets
    status: via-dependency
    reason: 'cobrapy covers this: model.add_metabolites([cobra.Metabolite(...)]).'
  - matlab: addRxns
    python: raven_toolbox.manipulation.add_reactions_from_equations
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#9
    scenarios:
      - add_reactions_from_equations_smallyeast
    notes: 'from migration.md. The keystone: equation-string to reactions, matching mets by id, name, or
      name[comp]; strict / auto policies for new mets and genes. Cross-validated on smallYeast over seven
      equations covering the reversible and irreversible arrows, integer and decimal coefficients on both sides
      of one equation, a metabolite that has to be created, a GPR naming two genes that have to be created, and
      explicit bounds overruling the arrow in both directions: same reactions, bounds, stoichiometry, gene rules
      and created entities. DIVERGENCE: a created metabolite gets metNames set to its id in RAVEN and no name at
      all in Python --- see #9 --- FIXED: add_reactions_from_equations now passes name=token when creating a
      metabolite from the mets_by="id" path, matching RAVEN. (A nameless metabolite would otherwise defeat the
      name-keyed matching in merge_compartments and add_reactions_from_model.) Defaults are not compared and are
      opposites:
      allowNewMets and allowNewGenes default false in RAVEN and true in the Python signature, so the scenario
      states both. The bounds an arrow implies also come from different places --- model.annotations.defaultLB /
      defaultUB against cobra''s configuration --- which agree at -1000/1000 for smallYeast by coincidence
      rather than by construction. Untested: eqnType 2 and 3, the name and name[compartment] token forms.'
  - matlab: addRxnsGenesMets
    python: raven_toolbox.manipulation.add_reactions_from_model
    status: parity
    scenarios:
      - add_reactions_from_model_smallyeast
    notes: 'from migration.md. Copy reactions from a source model, matching mets by name[comp] (vs cobra''s
      strict-by-id merge). Cross-validated on smallYeast by removing the oxidative pentose phosphate pathway
      together with the metabolites and genes it left unused, then transferring it back from the intact model:
      same reactions, same two metabolites created, same seven genes created, same stoichiometry, bounds and
      gene rules, and the same note and confidence score on each transferred reaction. Both the addGene=true and
      addGene=false paths are covered --- the second restores the reactions and metabolites and leaves the gene
      count untouched on both sides. Defaults are not compared: the note defaults to "Added via
      addRxnsAndMets()" on one side and "Added via add_reactions_from_model()" on the other, and the confidence
      score to 0 in RAVEN and to nothing in the Python signature, so the scenario states both. Untested: a draft
      and source that disagree about metabolite naming, which is where the name[comp] matching earns its
      keep.'
  - matlab: addTransport
    python: raven_toolbox.manipulation.add_transport_reactions
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#10
    scenarios:
      - add_transport_reactions_smallyeast
    notes: 'from migration.md. Transport across compartments, matching mets by name, sequential tr_NNNN ids.
      cobra has no transport primitive. Cross-validated on smallYeast, transporting four cytosolic metabolites
      known to exist in the mitochondrion, reversible and irreversible: same reaction names ("<met> transport,
      <fromCompName>-<toCompName>", built from compartment names not ids), same bounds, same species and
      coefficients on each side of the transport. BUG in addTransport, not a Python-side difference: it crashed
      with a dimension mismatch on this fixture''s natural default call (all metabolites in c, no metNames given)
      --- it built the reaction names from the full requested metabolite list but the reactions themselves from
      the subset that had a match in the target compartment, then concatenated the two without reconciling their
      lengths. Filed as #10 and FIXED: addTransport.m now filters names through the same per-branch subset as
      fromMetsInComp/toMets (a new namesInComp variable) and no longer transposes the result to a row vector
      incompatible with model.rxnNames. Reaction ids are not compared --- both sides mint fresh sequential ids
      unrelated to the transport itself.'
  - matlab: analyzeSampling
    status: python-pending
    notes: Correlates per-reaction expression t-scores with flux samples. No port decision is recorded either
      way. Left in the queue rather than declared a divergence, so the choice stays visible.
  - matlab: applyCondition
    python: raven_toolbox.conditions.apply_condition
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#15
    scenarios:
      - apply_condition_smallyeast
    notes: 'auto-paired (exact name match), now cross-validated --- and the pairing is a real, deliberately
      designed correspondence (both docstrings describe the same schema in near-identical language, down to the
      same worked examples), but one step of it genuinely disagreed. DIVERGENCE, confirmed end to end
      (raven-gecko-parity#15) --- FIXED: apply_condition now replicates RAVEN''s in/out rule via a new
      _exchange_direction helper before deciding which exchanges reset_exchanges resets; apply_condition_smallyeast
      now shows MATCH. The account below of the original divergence is kept for the record.
      prelude.reset_exchanges forwards its own value straight through to
      getExchangeRxns(model, value) on the RAVEN side (confirmed by reading conditions/applyCondition.m and
      queries/getExchangeRxns.m in full): "out" resets only the reactions where the boundary metabolite is the
      reaction''s product --- smallYeast''s five *OUT reactions --- and leaves every other reaction, including
      its three *IN (uptake) reactions, untouched. apply_condition cannot make this distinction at all; its own
      docstring says so directly ("cobrapy doesn''t distinguish RAVEN''s in / out directions; we reset every
      exchange reaction") and resets every exchange it finds via model.exchanges for any truthy value, whatever
      direction was actually named. On smallYeast (three uptake reactions --- glcIN, o2IN, ethIN --- shipped shut
      at (0,0)), applying the identical condition (reset_exchanges: "out") takes maximum growth from unreachable
      on the RAVEN side (nothing about nutrient availability changed --- the three uptakes are still shut) to
      ~90 on the Python side (glucose and oxygen uptake silently reopened, neither of which the condition named).
      This is not a one-off toy case: applyCondition''s own docstring names yeast-GEM as its first consumer, and
      "out" --- not a bare boolean --- is the value its own worked example uses, exactly the kind of condition a
      real yeast-GEM file plausibly writes to reset secretion capacity while leaving a separate, later `bounds`
      block in sole control of uptake. Ported through raven-toolbox as it stands, that condition would silently
      blow open whatever uptake constraints the model shipped with, with no error and no warning.
      apply_condition_smallyeast asserted exactly this split (five *OUT reactions matching on both sides, three
      *IN reactions matching each other only on the Python side, growth_after carrying the real consequence as
      one number) before the fix above; it is green now.
      NOT COMPARABLE, and not attempted: cofactor_pseudoreaction and biomass_stoichiometry_delta both need a
      metCharges-bearing fixture (fresh smallYeast has none --- see check_model_struct_smallyeast,
      diff_models_smallyeast) and are left for a fixture that wants to build one. Worth flagging from reading
      rather than running: applyCondition''s charge_balance_met step raises if any remaining metabolite''s charge
      is unknown; apply_condition''s equivalent silently treats a missing charge as neutral (0) and carries on ---
      a second, smaller divergence in the same function, not asserted by this scenario.'
  - matlab: assignCompartments
    python: raven_toolbox.localization.assign_compartments
    status: parity
    notes: 'Functionality-constrained compartment assignment: flux-free placement MILP certified by a real
      FBA, plus optional gap-fill coupling and flux-gated multi-localisation. The MATLAB back-port landed
      on feat/assigncompartments-certify and coexists with predictLocalization.m. Needs a scenario before
      this can be called settled.'
  - matlab: assignSBOterms
    python: raven_toolbox.annotation.add_sbo_terms
    status: parity
    scenarios:
      - assign_sbo_terms_smallyeast
    notes: 'Confirmed by yaml_format.md, which names both, and now cross-validated directly. Both classify every
      metabolite and reaction by the same rule set (biomass vs. simple chemical by met name; single-reactant
      reactions as exchange/sink/demand by compartment and coefficient sign; transport by shared metabolite
      names; named overrides for the biomass and NGAM reactions, beating the single-reactant default; a
      pseudoreaction-substring override; a metabolic-reaction fallback) and agree on every metabolite and every
      reaction on smallYeast, redirecting biomassRxnName/ngamRxnName to reaction names smallYeast actually has
      (its defaults are yeast-GEM-specific and match nothing here) so those two override branches --- and their
      priority over the single-reactant default --- are exercised rather than silently skipped. LATENT RISK, not
      exercised here: assignSBOterms''s transport check (getTransportRxns) flags a reaction whenever the same
      metabolite NAME appears more than once among its participants, with no regard for compartment at all;
      add_sbo_terms''s own default detector is explicitly documented in its own source as "a cheap analogue" that
      instead requires the name to appear in two or more DISTINCT compartments. The two agree on any model with
      no same-name-same-compartment duplicate metabolites --- checked directly against smallYeast''s own
      metabolite list, where every repeated name (acetyl-CoA, CO2, coenzyme A, NAD(+), NADH, NADP(+), NADPH) is a
      cytosol/mitochondria pair, never two entries in the same compartment --- and would diverge on a model that
      has one. NOT COMPARABLE, and not attempted: pseudoreactionSubstrings and onlyLastReactionForPseudo have
      nothing to exercise on this model (no smallYeast reaction name contains ''pseudoreaction''/''SLIME rxn'',
      and the bug-compat flag is off by default on both sides) --- not a gap in the scenario, just nothing this
      fixture reaches.'
  - matlab: buildEquation
    status: via-dependency
    reason: 'cobrapy covers this: reaction.build_reaction_string(use_metabolite_names=...).'
  - matlab: canConsume
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions. Confirmed
      by the gap-analysis row in todo.md.'
  - matlab: canProduce
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions. Confirmed
      by the gap-analysis row in todo.md.'
  - matlab: changeGrRules
    python: raven_toolbox.manipulation.change_gene_reaction_rules
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#12
    scenarios:
      - change_gene_rules_smallyeast
    notes: 'Confirmed by the protocol table in todo.md. Cross-validated on smallYeast for the two paths that
      agree: replace=true overwriting a GPR outright, and replace=false appending a new isozyme onto a reaction
      that already has one --- both produce identical genes-created and identical DNF on both sides.
      DIVERGENCE, confirmed directly rather than inferred: replace=false onto a reaction with NO existing GPR.
      changeGrRules unconditionally built "(old) or (new)", so on an empty old rule that was the literal string
      "() or (new)" --- not a valid gene, complex or isozyme. It did not raise: rxnGeneMat came out correctly
      populated (both new genes attached), but grRules{i} was left as that unparseable string, and grRuleToDNF /
      isDnfGrRule --- and so standardizeGrRules on any later call, and expandModel, which calls grRuleToDNF per
      reaction --- threw RAVEN:badGrRule on that reaction. The model was right in the matrix and broken in the
      text, and the failure surfaced wherever the text was next re-parsed, not at the changeGrRules call that
      caused it. change_gene_reaction_rules explicitly guards this case
      ("if replace or not rxn.gene_reaction_rule") and produces the clean rule with no artefact. See #12,
      FIXED: changeGrRules.m now only wraps-and-merges with "(old) or (new)" when an existing rule is actually
      present (per-element hasExisting check), using the new rule directly otherwise --- ATPX (no prior GPR)
      now gets a clean, directly parseable rule; HXK (existing GPR) still merges as before.'
  - matlab: changeRxns
    python: raven_toolbox.manipulation.change_reaction_equations
    status: parity
    scenarios:
      - change_reaction_equations_smallyeast
    notes: 'from migration.md. Stoichiometry change in place, delegating to the same metabolite-matching
      machinery as addRxns / add_reactions_from_equations. Both docstrings promise the change touches
      stoichiometry ONLY --- bounds, name, GPR, subsystem and objective coefficient survive because the reaction
      is rewritten in place rather than replaced. Cross-validated on smallYeast: rewired PGI to a different
      existing metabolite pair and rewrote HXK with a product that had to be created, then fingerprinted every
      one of the other 51 reactions before and after and found none of them moved. Same divergence as
      addRxns / add_reactions_from_equations on new-metabolite creation (raven-gecko-parity#9: the created
      metabolite is named after its id in RAVEN, left nameless in Python) --- inherited here rather than
      re-discovered, since both functions share the same underlying machinery. allowNewMets defaults false in
      RAVEN and true in the Python signature, stated explicitly for the same reason as addRxns. Untested:
      rewriting an equation''s arrow (reversible to irreversible or back) while the bounds do not follow it ---
      both docstrings warn this is the case a caller gets wrong, and this fixture''s arrow does not change.'
  - matlab: checkFileExistence
    status: internal
    reason: File-existence glue with MATLAB dialog prompts.
  - matlab: checkInstallation
    status: internal
    reason: Installation check. Python installs with pip.
  - matlab: checkModelStruct
    python: raven_toolbox.utils.check_model
    status: parity
    scenarios:
      - check_model_struct_smallyeast
    notes: 'from migration.md. Structured curation report. RAVEN''s struct/type checks are moot in cobra.
      Cross-validated on smallYeast with four deliberate edits, one per shared check: GPP''s equation rewritten to
      drop GLY_c (its only other reaction, glyOUT, is zeroed out in the same breath, leaving GLY_c orphaned but
      present); glyOUT''s stoichiometry zeroed directly, leaving it empty; biomassOUT''s objective coefficient
      zeroed, leaving the model with none; PGI''s GPR replaced outright with a gene (YSWAP1) used nowhere else,
      orphaning its old gene YBR196C without touching it directly. Both sides find exactly the same four issues
      for the same four entities: orphan_metabolite/GLY_c, orphan_gene/YBR196C, empty_reaction/glyOUT,
      objective/(none) --- confirmed by a standalone debug probe that inspected model state after each edit before
      calling either check. KEY FINDING: checkModelStruct''s own `category` output is not usable for this
      comparison as written, and this is a real quirk of RAVEN, not a scoping choice. That field comes from
      issueCategory(), a fixed elseif chain of substring matches over the free-text message, evaluated in one
      set order regardless of which check produced the message. Two of these four checks land under a category
      name unrelated to what they actually check: the empty-reaction message ("...are empty (no involved
      metabolites)") is caught by an earlier, unrelated `empty_id` branch (`contains(msg,''empty'')`) meant for
      blank-identifier checks, before ever reaching the branch that would tag it `unused`; the no-objective
      message ("...results in FBCv2 non-compliant SBML file...") is caught by an earlier, unrelated `invalid_id`
      branch (`contains(msg,''SBML'')`) meant for SBML/identifier-format checks, before ever reaching the branch
      that would tag it `objective`. The two orphan checks (metabolite, gene) do reach the same branch, but that
      branch tags both `unused` --- a single shared category, not two distinct ones. None of this is a
      difference in what is detected; it is purely the coarse post-hoc labelling layer. The MATLAB side works
      around it by reclassifying each issue from its exact, stable message text into the same four semantic
      category names check_model already uses (empty_reaction / orphan_metabolite / orphan_gene / objective),
      and compares those, never checkModelStruct''s own category strings. SCOPE: only four of
      checkModelStruct''s categories are exercised. Most of the rest (missing_field, wrong_type, invalid_bounds,
      invalid_formula, cross_reference, other) check RAVEN-struct properties a cobra.Model cannot even represent
      invalidly in the first place --- cobra enforces unique, non-empty reaction/metabolite/gene ids and real
      field types at the object level --- so check_model has nothing analogous to compare against them. "gpr" is
      left out despite both sides having something under that name: checkModelStruct''s gpr issues are grRule
      syntax/token problems (a trailing "or", an unparseable rule); raven_toolbox''s own GPR linter is
      find_non_dnf_grrules, a different check (is the rule in DNF) with no row of its own in this ledger yet.
      NOT COMPARABLE: "duplicate" (duplicate metabolite name+compartment) and multiple-objective are real,
      confirmed overlaps left unasserted rather than untested --- RAVEN reports one issue per offending entity
      (one per duplicate metabolite, one per surplus objective reaction), where check_model reports one issue
      for the whole group with the entity list folded into free text and object_id left None. There is no
      structured field on the Python side to recover that list from without parsing the message, so the two
      cannot be compared without exactly the text-matching this scenario otherwise avoids.'
  - matlab: checkProduction
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions. Confirmed
      by the gap-analysis row in todo.md.'
  - matlab: checkRxn
    status: subsumed
    reason: Single-reaction feasibility probe, used inside the gap-analysis entry points.
  - matlab: checkSolution
    status: via-dependency
    reason: 'cobrapy covers this: the Solution object carries status, objective_value and fluxes.'
  - matlab: checkTasks
    python: raven_toolbox.tasks.check_tasks
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#7
    scenarios:
      - task_checking_smallyeast
    notes: 'DIVERGENCE in the LP that a task is checked against. The two set up a task in different ways:
      checkTasks relaxes the metabolite balance (model.b) for the declared inputs and outputs and leaves the
      model''s own reactions exactly as they are, while check_tasks closed the model''s boundary reactions and
      worked through exchange reactions. A metabolite the model can already excrete through its own open exchange
      therefore stayed available to a RAVEN task even when the task did not list it, and did not to a Python one.
      Found by task_checking_smallyeast: GLC_AER_TIGHT (aerobic growth on glucose, CO2 the only declared outlet)
      is feasible in MATLAB via smallYeast''s own ethOUT/glyOUT, and was infeasible in Python. FIXED: RAVEN''s
      semantics are the deliberate one --- checkTasks is the original (f)(t)INIT task-checking implementation
      this framework is built around --- so close_boundaries was flipped to default False on both check_tasks
      and find_task_essential_reactions, reproducing the MATLAB verdict on all six tasks without callers having
      to pass it explicitly; task_checking_smallyeast now shows MATCH. Not solver noise, confirmed before the
      fix: the scenario names Gurobi on both sides, and the same single task differed under it as under
      glpk-against-Gurobi. Related: checkTasks warns when the model has no ''unconstrained'' field, so RAVEN''s
      task framework assumes models that keep their exchange *metabolites*, which a cobrapy model does not
      have.'
  - matlab: cleanSheet
    status: subsumed
    reason: Excel cell-cleaning helper; inside io.export_to_excel.
  - matlab: closeModel
    python: raven_toolbox.manipulation.close_model
    status: parity
    scenarios:
      - close_model_smallyeast
    notes: 'auto-paired (exact name match), now cross-validated --- and this pairing turned out to need real
      verification, not just a name match. Both sides detect the same "unit exchange" reactions by the same
      rule (sum(|coefficient|) == 1, a single-metabolite exchange/sink/demand with unit coefficient), restated
      independently on each side of the scenario rather than taken from either implementation: eight reactions on
      smallYeast (acOUT, biomassOUT, co2OUT, ethIN, ethOUT, glcIN, glyOUT, o2IN). What each side DOES to those
      eight afterwards shares no structure at all. closeModel appends a boundary metabolite --- in a new ''b''
      compartment --- to each one and never writes to lb/ub anywhere in its own source (confirmed by reading
      manipulation/closeModel.m in full). close_model leaves every metabolite and compartment untouched and sets
      rxn.bounds=(0,0) directly. A comparison of raw model shape (metabolite count, compartment count, bounds)
      would report a difference on every single run and say nothing about whether either function does its job
      --- so this scenario compares the one thing both mechanisms are answerable to regardless of how they work:
      whether each of the eight reactions is actually incapable of carrying flux afterwards, checked by
      optimising each one''s own flux to its minimum and maximum (0, 0 on both sides, confirmed with Gurobi on
      both), plus one whole-model number (maximum growth, with glucose and oxygen opened since smallYeast ships
      every carbon/oxygen source shut: ~1.2215 before closure, 0 after, on both sides). IMPORTANT: this is a case
      where reading the source was actively misleading. closeModel.m''s own docstring and body describe only a
      structural addition (new metabolite, new compartment) with no claim about flux, and the `unconstrained`
      flag it sets is not consulted anywhere in RAVEN''s own LP-solving path (confirmed: grep for
      `.unconstrained` across the repo turns up only I/O and bookkeeping consumers --- importModel, exportModel,
      getExchangeRxns, setExchangeBounds, mergeCompartments, simplifyModel --- never solver/solveLP.m). Read in
      isolation, closeModel looks like an inert, purely cosmetic bookkeeping operation. It is not: RAVEN''s own LP
      builder (solver/solveLP.m) solves reaction fluxes and one slack variable per metabolite together, with each
      slack bounded by that metabolite''s own model.b entry and pinned by the equality S*v - slack = 0.
      closeModel appends the scalar 0 as the new boundary metabolite''s model.b entry; since nothing else in the
      model ever touches that metabolite, its slack is pinned to exactly 0 too, which forces the one reaction
      touching it to zero flux --- despite that reaction''s own lb/ub being left exactly as they were. This was
      confirmed only by direct FBA measurement (an initial read-the-source-only hypothesis, that closeModel
      leaves solvable flux space unchanged, was wrong, and was caught by running the model rather than trusting
      the reading). control_reaction (PGI, an ordinary internal reaction neither implementation ever writes to
      directly) is checked before and after closure on each side independently: its own achievable maximum drops
      from 10 to 0 right along with the eight targeted reactions, on both sides --- the correct outcome, not a
      scoping leak, since PGI processes a product of glucose and has nothing to process once glcIN carries no
      flux, whatever PGI''s own bounds say. BUILD NOTE: solveLP''s sign convention (does solution.f come back
      negated relative to the maximised objective, or not) could not be fully traced through RAVEN''s own source
      --- the final step depends on renameparams, which turns solveLP''s osense into the ''min''/''max'' string
      the underlying solver receives, and is not part of the RAVEN repo at all. The scenario''s MATLAB side
      calibrates the sign empirically instead, against the model''s own unmodified, known-correct objective; see
      close_model_smallyeast.m''s flux_range() for the exact reasoning. INCIDENTAL FINDING, not scored here:
      readYAMLmodel.m unconditionally sets `model.c(pos,1) = 1` whenever a reaction declares
      `objective_coefficient`, never reading the key''s actual stored value --- invisible on smallYeast, whose
      own biomassOUT happens to declare exactly 1.0, but silently wrong for any model with a weighted or negative
      objective coefficient. Filed as raven-gecko-parity#14 and fixed (readYAMLmodel.m now reads
      str2double(tline_value) instead of hardcoding 1); not this row''s concern and not asserted by this
      scenario, which only ever exercises smallYeast''s existing 1.0 case. NOT COMPARABLE: raw model shape after
      closure (metabolite/compartment counts, bounds) --- see above.'
  - matlab: compareFluxes
    status: python-pending
    notes: Diagnostic flux comparison across conditions; cobra_raven_comparison.md calls it a practical tool
      COBRA lacks. No port decision is recorded either way. Left in the queue rather than declared a divergence,
      so the choice stays visible.
  - matlab: compareMultipleModels
    python: raven_toolbox.comparison.compare_models
    status: parity
    scenarios:
      - compare_multiple_models_smallyeast
    notes: 'from migration.md. Tidy DataFrames (reactions / mets / genes / subsystems presence + pairwise
      Jaccard + optional check_tasks pass/fail). Plotting and tSNE/MDS are one-liners in seaborn/scikit-learn;
      intentionally not in the function, and structCompMap (RAVEN''s own tSNE/MDS projection) needs the
      Statistics and Machine Learning Toolbox and is skipped when absent --- neither is a fixture either side of
      this parity claim. compareMultipleModels itself works in reaction-space only (its own docstring): only the
      reaction presence matrix is cross-validated, on three models built by removal and addition from smallYeast
      so every presence pattern (all three, exactly two, exactly one) is reachable and hand-checked; identical
      on both sides. THREE CONFIRMED SCOPE GAPS, found by reading both implementations rather than assumed: (1)
      compareMultipleModels has no metabolite or gene presence matrix at all --- compare_models''s is a strict
      addition, not a divergence in the shared part. (2) The similarity statistic is not the same computation:
      compareMultipleModels'' structComp is (1 - Hamming distance) = (B''*B + (1-B)''*(1-B)) / nRows, counting
      "both models lack this reaction" as agreement; compare_models'' similarity is Jaccard, counting only
      shared presence. Two models that mostly agree by both lacking most of a big universal reaction set score
      high on one and low on the other. (3) Subsystem handling: compareMultipleModels reads only a reaction''s
      first subsystem ("additional subSystems will be ignored", its own comment) and skips the whole subsystem
      comparison if any input model lacks the field; compare_models joins every subsystem with ";". Untested
      here regardless --- smallYeast carries no real subsystem data on any reaction. Tasks/functional comparison
      also untested --- compareMultipleModels'' own scenario never exercised it, independent of
      task_checking_smallyeast''s own status (raven-gecko-parity#7, since fixed --- see the checkTasks entry).'
  - matlab: compareRxnsGenesMetsComps
    status: subsumed
    reason: Pairwise entity comparison; comparison.compare_models returns the same information as tidy DataFrames
      for N models.
  - matlab: constructEquations
    status: matlab-only
    reason: reaction.build_reaction_string(use_metabolite_names=...) already does both id and name equations.
    notes: no obvious Python counterpart; decide whether one is needed
  - matlab: constructS
    status: via-dependency
