      as nothing to propagate and never clobbers with emptiness.'
  - matlab: ecFSEOF
    python: geckopy.ec_fseof
    status: parity
    scenarios:
      - ec_fseof_ectestgem
    notes: '[Py] thin wrapper over raven_toolbox.analysis.fseof; selection is regression-based.
      DIVERGENCE, now measured, on every axis: (1) the enforced-flux levels themselves differ
      before any target selection happens --- MATLAB''s alpha runs from the biomass-optimal
      production flux to 90% of the theoretical max, raven-toolbox''s levels run from
      target_max/n_steps to target_max with no reference to the biomass-optimal point at all;
      (2) MATLAB restricts the target search space to gene-associated reactions only,
      raven-toolbox''s classifier considers every reaction; (3) even on the same candidates the
      selection criterion differs --- MATLAB requires strict monotonicity across every step
      plus a top-quartile-by-slope cut, raven-toolbox uses a correlation+slope regression
      threshold (its own IMPROVEMENTS notes FS1-FS4). On ecTestGEM: MATLAB finds 1 target,
      geckopy finds 6. This is the same divergence already recorded on the RAVEN pair for
      FSEOF vs raven_toolbox.analysis.fseof (docs/behaviour-parity-plan.md), now confirmed to
      carry through the ecModel-specific wrappers on both sides too. Output shape differs
      further and is not asserted: MATLAB additionally computes a per-gene essentiality column
      and splits rxnTargets from transportTargets; geckopy''s ec_fseof does neither. See
      scenarios/ec_fseof_ectestgem/scenario.yml.'
  - matlab: ecFVA
    python: geckopy.ec_fva
    status: parity
    scenarios:
      - ec_fva_ectestgem
    notes: 'Confirmed against geckopy docs/migrating_from_gecko_matlab.md §5. DIVERGENCE, now
      measured: every reaction with a single enzyme (or none) agrees exactly; the one
      isozyme-split reaction does not. MATLAB reduces each ec-reaction''s own bound with
      min/max across every canonical group''s solve first, then sums forward and subtracts
      reverse (the "envelope") --- a canonical group''s forward and reverse variants can
      each be reduced against a different combination of the other, not necessarily one
      jointly achievable in any single feasible flux distribution. geckopy instead reads
      the combined forward-minus-reverse value directly off the one solve that actually
      optimised it (the "diagonal", geckopy''s own MATLAB-COMPAT note in ec_fva.py), always
      a value some feasible distribution attains. See
      scenarios/ec_fva_ectestgem/scenario.yml for the measured ranges.'
