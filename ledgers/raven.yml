      52 metabolites, same three transport reactions cancelled away (CAT2, CO2TRANS, ShuttleX), same summed
      stoichiometry, same bounds. Three things the scenario had to work around. (1) Merged metabolite IDS
      DIFFER: RAVEN keeps the id of the first copy it finds, so acetyl-CoA ends up as ACCOA_c or ACCOA_m naming
      a compartment that no longer exists --- its own docstring warns of this --- while the Python side rewrites
      the suffix to ACCOA_s. Compared by name instead, which is also what the grouping is built on (metNames on
      one side, and the same key passed explicitly on the other, since its default keys off the id suffix).
      (2) With deleteRxnsWithOneMet on, RAVEN reserves reactions that already had a single metabolite before
      the merge (a model''s exchange reactions) and deletes only those reduced to one by it; the Python side
      deletes both, so smallYeast would lose its eight exchanges. The scenario runs with the mode off.
      (3) mergeCompartments'' third output is documented as the reactions deleted for being duplicates, but it
      passes through contractModel''s *third* output (an indexed cell array, one entry per retained reaction)
      rather than its second (the flat list of removed ids). A caller reading the docstring gets one entry per
      surviving reaction instead.'
