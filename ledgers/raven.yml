  - matlab: setExchangeBounds
    python: raven_toolbox.manipulation.set_exchange_bounds
    status: parity
    notes: 'cobra''s model.medium covers the common single-direction, close-the-rest use case, but not
      everything setExchangeBounds does: independent lb and ub per metabolite (medium is reaction-id-keyed
      and sets only whichever one bound is "active" for that reaction, from a single scalar), the mediaOnly
      compartment filter, or the cross-reaction direction-consistency check that auto-disables closeOthers
      with a warning when exchanges are inconsistently oriented. set_exchange_bounds matches metabolites
      against the model''s exchanged set by id or name, reports unused ones, and replicates the
      direction-consistency check and the mediaOnly filter (via model.compartments, matching a compartment
      named "extracellular"). setExchangeBounds''s own "metabolite in more than one exchange reaction"
      diagnostic warning has a latent bug (unique(metInd,''first'') returns indices into the original array,
      then ismember(1:numel(tbl), i) compares that against a range sized to the number of *unique* values ---
      two differently-sized index spaces, so the check can never find a real overlap) and never actually fires.
      Purely diagnostic --- does not affect which bounds get set. set_exchange_bounds implements the equivalent
      warning correctly rather than replicating the bug.'
  - matlab: setGAM
    python: raven_toolbox.biomass.set_gam
    status: parity
    notes: 'Both only rescale biomass-equation metabolites with a nonzero coefficient whose name is in the
      cofactor-name list, to sign(coefficient)*value --- algebraically identical (MATLAB''s direct S-matrix write
      vs. Python''s add_metabolites delta, cobra''s sparse dict already excluding zero-coefficient entries). NGAM
      handling matches: both require the reaction id and the value non-null before fixing that reaction''s bounds
      to (value, value). A missing biomassRxn errors explicitly on both sides. Only difference is calling
      convention (Python''s extra arguments are keyword-only).'
