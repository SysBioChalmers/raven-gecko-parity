  - matlab: getStandardKcat
    python: geckopy.assign_standard_kcat
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'DIVERGENCE, on the code path a subSystems-carrying model reaches, not exercised by the ecTestGEM
      fixture (which has none): the per-subsystem kcat aggregation is the arithmetic mean in MATLAB and the
      median in geckopy (deliberate on the Python side --- kcats span orders of magnitude and a mean is
      dominated by the largest member), a >100x difference on a skewed sample. The reaction count used for
      the subsystem''s own >=threshold eligibility check also differs: MATLAB counts every mapped ec.rxns row
      including zero/NaN-kcat ones, geckopy counts only already-nonzero ones, so the two sides can take
      different branches (subsystem-specific vs. global fallback) for the same input. Neither is flagged as a
      MATLAB-COMPAT note upstream. Also: fillZeroKcat/fill_zero_kcat treats a NaN kcat as unset in MATLAB but
      not in geckopy (geckopy only treats literal 0 as unset) --- undocumented, not exercised by ecTestGEM
      either.'
  - matlab: getSubsetEcModel
    python: geckopy.get_subset_ec_model
    status: parity
    notes: '[Py] returns a new EcModel; the input is not mutated. MATLAB''s same-starting-GEM mismatch
      error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already on develop3) --- crashes with
      "Undefined function ''dispEM''" instead of naming the mismatched reactions.'
