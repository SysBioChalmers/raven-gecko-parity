  - matlab: getEnzymeBottlenecks
    python: geckopy.get_enzyme_bottlenecks
    status: parity
    notes: 'Per-enzyme dual-based bottleneck ranker: top-N enzymes by |shadow price| of their prot_<id>
      mass-balance constraint. An enzyme that carries zero flux at the optimum has a genuinely
      LP-dual-degenerate shadow price: which value comes back (an exact 0, or the shared protein pool''s own
      nonzero dual propagated uniformly to it) depends on the solver build/platform/presolve path, not on the
      calling language --- not a stable MATLAB-vs-Python split. Only what is stable everywhere is compared:
      every primal-derived value (flux, capUsage, upperBound) and that results are sorted by non-increasing
      |shadowPrice|, not a specific shadow-price value for any zero-flux enzyme.'
