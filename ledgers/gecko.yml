      - ec_model_full_yeastgem
    notes: '[3->4] ec.genes/enzymes/mw/sequence sorted alphabetically for stable order on both sides. KEGG
      fallback for unmatched genes (opt-in via kegg_db= on the Python side) is also ported to makeEcModel.m
      stage 7: a gene UniProt can''t match falls back to databases.kegg for MW/sequence/accession (or the
      bare KEGG gene id, when the KEGG row itself has no UniProt accession) instead of getting no enzyme data
      at all. ModelAdapter gains getKeggCompatibleGenes, matching Python''s adapter.get_kegg_compatible_genes.
      [Py] single return; unmatched genes logged and annotated on rxn.notes[''geckopy_warning'']. Both expand
      yeast-GEM''s 4102 conventional reactions to 4671 ec.rxns identically.'
