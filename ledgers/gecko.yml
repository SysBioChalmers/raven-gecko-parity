  - matlab: getPfbaEnzymes
    python: geckopy.pfba_enzymes
    status: parity
    notes: 'pFBA variant minimising total usage_prot_* flux (enzyme mass) instead of all fluxes, with a
      deliberate ~1e-6 relative safety margin borrowed from solveLP''s own minFlux=1 technique. Reports a
      primal solution (fluxes), which is stable across repeated runs, unlike getEnzymeBottlenecks''
      dual-degeneracy finding. usage_prot_<id> reactions with lb<0 (reverse flux) are rejected rather than
      silently minimised incorrectly --- not reachable through any real GECKO 3 ecModel today.'
