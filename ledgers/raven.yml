    notes: 'DIVERGENCE, now measured. Expand-then-contract was a round trip in RAVEN and lossy in raven-toolbox
      --- FIXED: decided the round trip should be lossless (RAVEN''s behaviour is correct), so
      remove_duplicate_reactions was rewritten to match. On smallYeast expanded to 77 reactions both contract
      back to 53 and remove the same 24, so the detection agrees; what survives now does too. contractModel keeps
      the FIRST member of each set, strips the _EXP_N suffix (documented behaviour: the model is assumed to have
      come through expandModel) and merges the set''s grRules with "or", so HXK returns with "YCL040W or YFR053C
      or YGL253W". remove_duplicate_reactions now does the same: keep=rxns[0] (was rxns[-1]), a new
      _merge_gene_reaction_rules combining every survivor''s top-level OR-clauses (via cobra''s own GPR AST, not
      hand-rolled bracket parsing), and the _EXP_ suffix stripped when every duplicate in the group carries one
      --- verified against the exact reproducer above: HXK survives with all three isozymes,
      "YFR053C or YGL253W or YCL040W", matching RAVEN exactly. Separately, the two disagree on what counts as a
      duplicate: contractModel compares stoichiometry with distReverse, while remove_duplicate_reactions also
      requires identical bounds and objective coefficient. Detection is a different function on both sides and
      IS at parity --- see findDuplicateRxns and duplicate_reactions_smallyeast. No scenario asserts the merge
      yet; add_reactions_from_equations_smallyeast''s round trip is the closest existing coverage but does not
      exercise contraction.'
