  - matlab: standardizeGrRules
    python: raven_toolbox.utils.find_non_dnf_grrules
    status: parity
    scenarios:
      - standardize_gr_rules_smallyeast
    notes: 'from migration.md. Lint-only half; cobra auto-normalises GPRs on assignment, so the rewriting half
      isn''t ported, and now cross-validated on the half that is. standardizeGrRules returns three things ---
      grRules (a standardized string), rxnGeneMat (rebuilt to match), and indexes2check (reactions
      findPotentialErrors flags as non-DNF) --- and only the third has a raven_toolbox counterpart at all: cobra
      auto-normalises a GPR''s brackets and operator case the moment a grRule string is assigned to a reaction, so
      there is nothing to hold RAVEN''s own bracket-formatting convention up against. indexes2check comes from
      findPotentialErrors, itself a per-reaction call to isDnfGrRule (confirmed by reading
      manipulation/findPotentialErrors.m); find_non_dnf_grrules calls the analogous is_dnf per reaction. Both
      checks were already cross-validated directly, on synthetic strings chosen to exercise the syntax both
      parsers accept, by gpr_dnf_rules --- this scenario is not re-testing that primitive, it is checking that the
      WRAPPER around it (walk every reaction in an actual model, report which ones are flagged) has no
      off-by-one or field-mapping bug of its own, on a real fixture rather than a hand-built one. smallYeast''s own
      GPRs are all single genes or plain ORs, none non-DNF, so HXK''s rule was deliberately rewritten to
      "(YFR053C or YGL253W) and YCL040W" (an OR nested inside an AND, using two of the three real isozyme genes
      it already has) to give the detector something to find; both sides report exactly {HXK} and nothing else.
      NOT COMPARABLE, and not attempted: an unparseable grRule. findPotentialErrors reports these too;
      find_non_dnf_grrules cannot reach the same case the same way, because cobra''s own parser has already
      turned an unparseable string into an empty GPR at assignment time, and find_non_dnf_grrules skips an empty
      rule outright --- the same accepted-syntax gap gpr_dnf_rules already documents, not a new one.'
