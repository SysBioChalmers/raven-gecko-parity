  - matlab: applyKcatConstraints
    python: geckopy.apply_kcat_constraints
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: '[3->4] writes coefficients with the forward-direction usage_prot_* / prot_pool_exchange convention.
      DIVERGENCE, now measured: in the light-model formulation, when only some isozymes of a reaction have a
      kcat assigned, MATLAB corrects an unassigned isozyme''s Inf cost (MW/0) to 0 before taking min() across
      isozymes, so the fabricated zero always wins --- silently writing a zero enzyme cost for the whole
      reaction even though another isozyme has a real, valid kcat. geckopy skips invalid isozymes before the
      comparison instead, correctly picking the real one. See docs/gecko-behaviour-parity-plan.md.
      A second bug, also found by direct execution but not asserted by the scenario (not reachable through
      the shared fixture): in the full formulation, two enzyme rows mapping to the same prot_<accession>
      metabolite (distinct genes sharing one UniProt entry) got MATLAB''s last-write-wins instead of summed,
      since repeated linear-index assignment in MATLAB keeps only the last value, where geckopy explicitly
      sums. Fixed in GECKO#431.'
