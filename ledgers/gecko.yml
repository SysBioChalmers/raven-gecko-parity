    notes: 'DIVERGENCE, now measured. Both agree on the twenty standard residues to the
      gram-mole. Four differences: the water-mass constant (18 vs 18.01528); X''s mass
      (126.50, an unsourced historical constant, vs the live mean of the standard table,
      118.885); B''s mass (114.60 pre-rounded vs 114.595 computed) --- not previously
      documented; and shape --- calculateMW is case-sensitive (a lowercase letter is
      ignored, like a digit) and returns 18 for a sequence with no recognised residues,
      where calculate_mw upper-cases first and returns NaN for the same case. All eighteen
      cases in molecular_weight_sequences are red on purpose.'
