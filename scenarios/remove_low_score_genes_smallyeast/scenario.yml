id: remove_low_score_genes_smallyeast
pair: raven
description: >-
  ftINIT's last pruning step: dropping negative-scoring genes from a GPR
  while respecting enzyme structure --- an isozyme member can be dropped
  individually, a complex subunit cannot, and a whole complex can still
  lose to a better isozyme alternative.

entries:
  - removeLowScoreGenes

inputs:
  model: "{matlab_repo}/tutorial/smallYeast.yml"

  # PGI's real rule (a single gene) is replaced with a synthetic one built
  # from changeGrRules / change_gene_reaction_rules --- already
  # cross-validated by change_gene_rules_smallyeast, so leaning on it here to
  # manufacture a case smallYeast has no natural example of is safe. smallYeast
  # has no AND anywhere in its own grRules, so without this the complex-
  # preservation rule below would go completely untested.
  synthetic_rule:
    reaction: PGI
    grRule: "G1 or (G2 and G3)"

  # Three reactions, three distinct outcomes:
  #
  #   HXK   real isozyme OR (YFR053C or YGL253W or YCL040W). Two negative,
  #         one positive: the positive one survives alone.
  #   PFK   real isozyme OR (YGR240C or YMR205C), both negative but at
  #         different scores: the least-negative survives. Not a tie, so
  #         this does not touch RAVEN's documented random tie-break.
  #   PGI   the synthetic rule above. Both OR-alternatives end up
  #         negative --- G1 alone, and the complex aggregated by min(G2, G3)
  #         --- so this is the "all negative, keep the least-negative"
  #         fallback again, except one of the alternatives is a complex:
  #         G2's own negative score does not get it individually stripped
  #         from "(G2 and G3)", and the complex survives whole because its
  #         aggregate (-1, from G2) beats G1's own -5. This is RAVEN's own
  #         documented worked example ("G1 or (G2 and G3 and G4); Negative:
  #         G1, G2; New: G2 and G3 and G4"), reproduced with three genes
  #         instead of four.
  scores:
    YFR053C: -3.0
    YGL253W: -1.0
    YCL040W: 4.0
    YGR240C: -5.0
    YMR205C: -2.0
    G1: -5.0
    G2: -1.0
    G3: 3.0

  # Both default to these on the other INIT scoring functions in this suite
  # (scoreComplexModel / score_reactions_from_genes); stated so a change to
  # either default is caught here rather than silently changing the aggregation.
  isozyme_scoring: max
  complex_scoring: min

# What this scenario does NOT cover, on purpose: an exact tie between two
# all-negative alternatives. RAVEN's own docstring says the tie-break is
# random ("if there is a tie, one will be selected at random"); the Python
# side picks deterministically instead (documented in its own docstring as a
# deliberate departure --- "same quality, reproducible"). A tied fixture would
# not give RAVEN a single right answer to compare against, so none of the
# scores above are equal to any other. Recorded on the ledger row.
#
# Every reaction other than the three above is asserted unchanged: this
# function's whole contract is that it prunes exactly the genes it should and
# touches nothing else, and that is only evidence if the rest of the model is
# looked at too.

tolerance:
  # Nothing computed; a GPR is either what the pruning was supposed to
  # produce or it is not.
  rel: 0.0
  abs: 0.0
