# Where the four repos live and how to scan them.
#
# Paths are resolved relative to this file. Override them for your machine in
# `parity.local.toml` (same structure, gitignored) rather than editing this file:
#
#   [pairs.raven.matlab]
#   path = "D:/checkouts/RAVEN"

[pairs.raven]
ledger = "ledgers/raven.yml"

[pairs.raven.matlab]
repo = "SysBioChalmers/RAVEN"
ref = "develop3"
path = "../RAVEN"
# Directories that hold no public API: vendored code, tests, tutorials, installers, docs.
exclude = ["software", "testing", "tutorial", "installation", "doc", "docs", "external"]

[pairs.raven.python]
repo = "SysBioChalmers/raven-toolbox"
ref = "develop"
path = "../raven-toolbox"
package = "raven_toolbox"
src = "src"

[pairs.gecko]
ledger = "ledgers/gecko.yml"

[pairs.gecko.matlab]
repo = "SysBioChalmers/GECKO"
ref = "develop4"
path = "../GECKO"
exclude = ["test", "tutorials", "doc", "docs"]
# GECKO is built on RAVEN --- importModel, the model struct itself, getExchangeRxns ---
# and ships no copy of it, so a scenario needs both toolboxes on the path. `{raven_matlab}`
# is the RAVEN path this same file configures, so overriding that path in
# `parity.local.toml` moves this too. RAVEN goes on first: addpath prepends, so GECKO wins
# where the two define the same name.
setup = "addpath(genpath('{raven_matlab}')); addpath(genpath('{path}'))"

[pairs.gecko.python]
repo = "SysBioChalmers/geckopy"
ref = "main"
path = "../geckopy"
package = "geckopy"
src = "src"
