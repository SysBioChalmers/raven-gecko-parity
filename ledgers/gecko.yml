    notes: '[3->4] usage flux read from positive usage_prot_* flux.'
  - matlab: enzymeUsage
    status: subsumed
    reason: Deprecated alias for getEnzymeUsage (src/deprecated/enzymeUsage.m); warns with GECKO:deprecatedName
      and forwards to it. Not a separate function to track.
  - matlab: fillEnzConcs
    python: geckopy.fill_enz_concs
    status: parity
    scenarios:
