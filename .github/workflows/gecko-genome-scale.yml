name: gecko-genome-scale

# Tier 4 of docs/gecko-behaviour-parity-plan.md: the ec_model_full_yeastgem scenario,
# run at real genome scale (GECKO's own yeast-GEM tutorial model --- 4102 conventional
# reactions, a 30000-row BRENDA snapshot) rather than the 7-reaction ecTestGEM fixture
# every other gecko-pair scenario uses. Kept separate from nightly.yml rather than added
# to its scenario sweep, both because it needs the full (non-sparse) GECKO checkout that
# the nightly's gecko entry does not otherwise require, and because this scenario is
# deliberately, documentedly not a clean match (scenarios/ec_model_full_yeastgem/scenario.yml
# has the full account) --- folding a scenario that is expected to differ into a job that
# fails the whole matrix on any difference would either hide real regressions behind an
# expected one, or force this scenario's known divergences into nightly's own
# pass/fail logic. This job never fails on a *difference*; it fails only if either side
# cannot complete the pipeline at all.

on:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sundays --- this is a slow job, not a per-push check
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .

      - id: refs
        run: |
          eval "$(parity refs --pair raven --format shell)"
          echo "raven_matlab_repo=$raven_matlab_repo" >> "$GITHUB_OUTPUT"
          echo "raven_matlab_ref=$raven_matlab_ref" >> "$GITHUB_OUTPUT"
          echo "raven_python_repo=$raven_python_repo" >> "$GITHUB_OUTPUT"
          echo "raven_python_ref=$raven_python_ref" >> "$GITHUB_OUTPUT"
          eval "$(parity refs --pair gecko --format shell)"
          echo "matlab_repo=$gecko_matlab_repo" >> "$GITHUB_OUTPUT"
          echo "matlab_ref=$gecko_matlab_ref" >> "$GITHUB_OUTPUT"
          echo "python_repo=$gecko_python_repo" >> "$GITHUB_OUTPUT"
          echo "python_ref=$gecko_python_ref" >> "$GITHUB_OUTPUT"

      # RAVEN: needed on the MATLAB path (GECKO is built on it) even though it is not
      # the pair under test here. raven-toolbox: needed to install geckopy's own
      # dependency from the checkout rather than whatever its git ref currently
      # resolves to --- same reasoning as nightly.yml's gecko entry.
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.raven_matlab_repo }}
          ref: ${{ steps.refs.outputs.raven_matlab_ref }}
          path: repos/RAVEN
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.raven_python_repo }}
          ref: ${{ steps.refs.outputs.raven_python_ref }}
          path: repos/raven-toolbox

      # GECKO: full checkout, not sparse --- this scenario needs tutorials/full_ecModel/
      # (yeast-GEM.yml, YeastGEMAdapter.m) and databases/ (the real BRENDA snapshot),
      # neither of which nightly.yml's gecko entry needs for the ecTestGEM-scale
      # scenarios it runs.
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.matlab_repo }}
          ref: ${{ steps.refs.outputs.matlab_ref }}
          path: repos/GECKO
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.python_repo }}
          ref: ${{ steps.refs.outputs.python_ref }}
          path: repos/geckopy

      - name: Point parity at the checked-out repos, and install geckopy
        run: |
          cat > parity.local.toml <<'EOF'
          [pairs.raven.matlab]
          path = "repos/RAVEN"
          [pairs.gecko.matlab]
          path = "repos/GECKO"
          [pairs.gecko.python]
          path = "repos/geckopy"
          EOF
          pip install ./repos/raven-toolbox
          # --no-deps: geckopy's own metadata pins raven-toolbox to a git ref, which
          # would otherwise override the pinned checkout just installed above.
          pip install --no-deps ./repos/geckopy
          python -c "
          import tomllib
          with open('repos/geckopy/pyproject.toml', 'rb') as f:
              deps = tomllib.load(f)['project']['dependencies']
          print('\n'.join(d for d in deps if not d.strip().startswith('raven-toolbox')))
          " > geckopy-deps.txt
          pip install -r geckopy-deps.txt

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      # Same two accepted shapes, same reasoning, as nightly.yml's Gurobi licence step.
      - name: Gurobi licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: |
          umask 077
          licence="$HOME/gurobi.lic"
          if [ -n "$LICENCE_FILE" ]; then
            printf '%s\n' "$LICENCE_FILE" > "$licence"
          elif [ -n "$WLSACCESSID" ] && [ -n "$WLSSECRET" ] && [ -n "$LICENSEID" ]; then
            { echo "WLSACCESSID=$WLSACCESSID"
              echo "WLSSECRET=$WLSSECRET"
              echo "LICENSEID=$LICENSEID"
            } > "$licence"
          else
            echo "::error::no Gurobi licence configured; ec_model_full_yeastgem needs one"
            exit 1
          fi
          echo "GRB_LICENSE_FILE=$licence" >> "$GITHUB_ENV"

      - name: Run the Python side
        run: parity run ec_model_full_yeastgem --impl python

      - name: Stage the MATLAB side
        run: parity prepare ec_model_full_yeastgem --guard > matlab_side.m

      # MATLAB must be started by this action, not by us --- see nightly.yml's own note
      # on why (public-repository licensing only covers matlab-actions' own entry points).
      - name: Run the MATLAB side
        uses: matlab-actions/run-command@v3
        with:
          command: "run('matlab_side.m')"

      - name: Collect the MATLAB result
        run: parity collect ec_model_full_yeastgem

      # Deliberately does not fail the job on a difference: this scenario documents
      # confirmed, expected divergences (scenarios/ec_model_full_yeastgem/scenario.yml).
      # `parity compare` still exits non-zero on any difference, expected or not, so its
      # own output --- captured here regardless of that exit code --- is what a human
      # reviews to tell "still just the known divergences" from "something new broke".
      - name: Compare
        run: |
          parity compare results/matlab/ec_model_full_yeastgem.json \
            results/python/ec_model_full_yeastgem.json \
            --scenario ec_model_full_yeastgem --limit 500 \
            | tee compare-output.txt || true
          {
            echo "## ec_model_full_yeastgem"
            echo '```'
            cat compare-output.txt
            echo '```'
            echo "See scenarios/ec_model_full_yeastgem/scenario.yml for which of these are already confirmed and documented."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ec_model_full_yeastgem-results
          path: |
            results/
            compare-output.txt
