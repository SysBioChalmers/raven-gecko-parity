      divergence as writeYAMLmodel / write_yaml_model, one level down.'
  - matlab: selectKcatValue
    python: geckopy.apply_kcat_list
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: 'DIVERGENCE, now measured. criteria=''max''/''min'' match exactly (including the shared documented
      MATLAB-COMPAT choices: geckopy lowercases ec.source and appends fuzzy wildcard/origin detail; returns
      updated reaction ids instead of positions). criteria=''median''/''mean'' are dead code in MATLAB ---
      selectKcatValue.m computes [selectedKcats(i),j] = median(...)/mean(...), a two-output call standard
      MATLAB median/mean do not support (only max/min do); confirmed by direct execution to error
      unconditionally with "Too many output arguments" on any non-empty kcatList. GECKO''s own
      test/VerificationMatrix.tsv already flags this function as under-tested (''we did not test all possible
      parameterizations here''), and no call site anywhere in the codebase, including the function''s own
      docstring example, ever passes criteria=''median''/''mean''. geckopy''s apply_kcat_list has no such
      restriction and computes both correctly. criteria=''max'' also confirmed at genome scale
      (ec_model_full_yeastgem, Tier 4), modulo the upstream kcat-matching divergences recorded on
      fuzzyKcatMatching''s own row --- this function correctly reproduces whatever selectKcatValue was
      handed.'
