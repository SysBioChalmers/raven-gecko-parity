id: homology_chain
pair: raven
description: >-
  Homology-based reconstruction, compared stage by stage: the BLAST hit table,
  then the draft model built from a fixed ortholog mapping. Two checkpoints in
  one run, so a divergence is located rather than merely observed.

entries:
  - getBlast
  - getModelFromHomology
  - makeFakeBlastStructure

inputs:
  # Four sequences per side: BLAST finishes in about a second, and the hits are
  # few enough to read when they disagree.
  query_fasta: "{matlab_repo}/testing/function_tests/test_data/human_galactosidases.fa"
  ref_fasta: "{matlab_repo}/testing/function_tests/test_data/yeast_galactosidases.fa"
  query_id: human
  ref_id: yeast

  # No e-value input: both sides now default to RAVEN's 1e-4, so each running
  # its own default is the more faithful comparison. Passing a value would hide
  # a future divergence in either default behind the scenario.

  # The draft checkpoint uses a synthetic ortholog mapping instead of the BLAST
  # output above: the galactosidase sequences have no model to transfer from,
  # and a fixed mapping makes the model-building logic the only variable.
  model: "{matlab_repo}/tutorial/smallYeast.yml"
  source_model_id: smallYeast
  target_organism_id: tgtOrg
  ortholog_count: 20

tolerance:
  # Both sides parse the same BLAST output text, so the numbers should agree to
  # the digits BLAST printed. Loose enough for float round-tripping through
  # JSON, tight enough that a real scoring difference fails.
  rel: 1.0e-9
  abs: 1.0e-12
