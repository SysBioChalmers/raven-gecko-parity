# Parity ledger --- raven
#
# One row per public function on either side. `parity check` fails if a public
# function is missing here, or if a row names something that no longer exists.
#
# status:
#   parity          Both sides implement this and are intended to behave the same.
#   python-pending  MATLAB has it; a Python port is queued.
#   matlab-pending  Python has it; a MATLAB back-port is queued.
#   matlab-only     Deliberately MATLAB-only --- not coming to Python.
#   python-only     Deliberately Python-only --- not going to MATLAB.
#   via-dependency  The other side gets this from a dependency (cobrapy, COBRA Toolbox) instead.
#   subsumed        The other side has the capability inside another function, not as its own entry point.
#   internal        Not part of the cross-implementation API (glue, installers, helpers).
#   unreviewed      Not yet triaged. Drive this count to zero.
#
# Regenerate the human-readable view with: parity report --pair raven

version: 1
pair: raven
matlab: SysBioChalmers/RAVEN
python: SysBioChalmers/raven-toolbox

entries:
  - matlab: addExchangeRxns
    status: via-dependency
    reason: 'cobrapy covers this: model.add_boundary(metabolite, type=''exchange'').'
  - matlab: addGenesRaven
    status: via-dependency
    reason: 'cobrapy covers this: genes are created automatically from a reaction''s GPR.'
  - matlab: addIdentifierPrefix
    status: via-dependency
    reason: 'Its only caller is io/exportModel.m, itself via-dependency (cobra.io.write_sbml_model);
      cobrapy''s own SBML writer owns id-safety handling, so there''s no standalone Python use case.'
  - matlab: addMets
    status: via-dependency
    reason: 'cobrapy covers this: model.add_metabolites([cobra.Metabolite(...)]).'
  - matlab: addRxns
    python: raven_toolbox.manipulation.add_reactions_from_equations
    status: parity
    scenarios:
      - add_reactions_from_equations_smallyeast
    notes: 'from migration.md. The keystone: equation-string to reactions, matching mets by id, name, or
      name[comp]; strict / auto policies for new mets and genes. A metabolite created while adding a reaction
      gets name=token on both sides, matching RAVEN (a nameless metabolite would otherwise defeat the name-keyed
      matching in merge_compartments and add_reactions_from_model). allowNewMets and allowNewGenes default false
      in RAVEN and true in the Python signature. The bounds an arrow implies come from different places ---
      model.annotations.defaultLB/defaultUB against cobra''s configuration --- which agree at -1000/1000 for
      smallYeast by coincidence rather than by construction.'
  - matlab: addRxnsGenesMets
    python: raven_toolbox.manipulation.add_reactions_from_model
    status: parity
    scenarios:
      - add_reactions_from_model_smallyeast
    notes: 'from migration.md. Copy reactions from a source model, matching mets by name[comp] (vs cobra''s
      strict-by-id merge). Both the addGene=true and addGene=false paths behave the same: the second restores
      the reactions and metabolites and leaves the gene count untouched. The default note text differs: "Added
      via addRxnsAndMets()" on the MATLAB side, "Added via add_reactions_from_model()" on the Python side. The
      default confidence score also differs: 0 in RAVEN, unset in the Python signature.'
  - matlab: addTransport
    python: raven_toolbox.manipulation.add_transport_reactions
    status: parity
    scenarios:
      - add_transport_reactions_smallyeast
    notes: 'from migration.md. Transport across compartments, matching mets by name, sequential tr_NNNN ids.
      cobra has no transport primitive. Same reaction names ("<met> transport, <fromCompName>-<toCompName>",
      built from compartment names not ids), same bounds, same species and coefficients on each side of the
      transport. Reaction ids are not compared --- both sides mint fresh sequential ids unrelated to the
      transport itself.'
  - matlab: analyzeSampling
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#41
    notes: Correlates per-reaction expression t-scores with flux samples. No port decision is recorded either
      way. Left in the queue rather than declared a divergence, so the choice stays visible.
  - matlab: applyCondition
    python: raven_toolbox.conditions.apply_condition
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#65
    scenarios:
      - apply_condition_smallyeast
    notes: 'Both docstrings describe the same schema, down to the same worked examples. prelude.reset_exchanges
      forwards its own value straight through to getExchangeRxns(model, value) on the RAVEN side: "out" resets
      only the reactions where the boundary metabolite is the reaction''s product, leaving every other reaction,
      including uptake reactions, untouched. apply_condition replicates the same distinction via its own
      _exchange_direction helper before deciding which exchanges reset_exchanges resets.
      NOT COMPARABLE, and not attempted: cofactor_pseudoreaction and biomass_stoichiometry_delta both need a
      metCharges-bearing fixture (fresh smallYeast has none --- see check_model_struct_smallyeast,
      diff_models_smallyeast) and are left for a fixture that wants to build one. DIVERGENCE: applyCondition''s
      charge_balance_met step raises if any remaining metabolite''s charge is unknown; apply_condition''s
      equivalent silently treats a missing charge as neutral (0) and carries on.'
  - matlab: assignCompartments
    python: raven_toolbox.localization.assign_compartments
    status: parity
    notes: 'Functionality-constrained compartment assignment: flux-free placement MILP certified by a real
      FBA, plus optional gap-fill coupling and flux-gated multi-localisation. The MATLAB back-port landed
      on feat/assigncompartments-certify and coexists with predictLocalization.m. Needs a scenario before
      this can be called settled.'
  - matlab: assignSBOterms
    python: raven_toolbox.annotation.add_sbo_terms
    status: parity
    scenarios:
      - assign_sbo_terms_smallyeast
    notes: 'Both classify every metabolite and reaction by the same rule set (biomass vs. simple chemical by met
      name; single-reactant reactions as exchange/sink/demand by compartment and coefficient sign; transport by
      shared metabolite names; named overrides for the biomass and NGAM reactions, beating the single-reactant
      default; a pseudoreaction-substring override; a metabolic-reaction fallback). LATENT RISK: assignSBOterms''
      transport check (getTransportRxns) flags a reaction whenever the same metabolite NAME appears more than
      once among its participants, with no regard for compartment at all; add_sbo_terms'' own default detector is
      documented in its own source as "a cheap analogue" that instead requires the name to appear in two or more
      DISTINCT compartments. The two agree on any model with no same-name-same-compartment duplicate metabolites
      and would diverge on a model that has one. NOT COMPARABLE: pseudoreactionSubstrings and
      onlyLastReactionForPseudo have nothing to exercise on smallYeast (no reaction name contains
      ''pseudoreaction''/''SLIME rxn'', and the bug-compat flag is off by default on both sides).'
  - matlab: buildEquation
    status: via-dependency
    reason: 'cobrapy covers this: reaction.build_reaction_string(use_metabolite_names=...).'
  - matlab: canConsume
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions.'
  - matlab: canProduce
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions.'
  - matlab: changeGrRules
    python: raven_toolbox.manipulation.change_gene_reaction_rules
    status: parity
    scenarios:
      - change_gene_rules_smallyeast
    notes: 'Both sides agree on the two paths: replace=true overwrites a GPR outright, and replace=false appends
      a new isozyme onto a reaction that already has one --- identical genes-created and identical DNF on both
      sides. replace=false onto a reaction with no existing GPR also agrees: changeGrRules only wraps-and-merges
      with "(old) or (new)" when an existing rule is actually present (a per-element hasExisting check), using
      the new rule directly otherwise; change_gene_reaction_rules guards the same case explicitly ("if replace or
      not rxn.gene_reaction_rule"). Both produce a clean, directly parseable rule when there is no prior GPR.'
  - matlab: changeRxns
    python: raven_toolbox.manipulation.change_reaction_equations
    status: parity
    scenarios:
      - change_reaction_equations_smallyeast
    notes: 'from migration.md. Stoichiometry change in place, delegating to the same metabolite-matching
      machinery as addRxns / add_reactions_from_equations. Both docstrings promise the change touches
      stoichiometry ONLY --- bounds, name, GPR, subsystem and objective coefficient survive because the reaction
      is rewritten in place rather than replaced. allowNewMets defaults false in RAVEN and true in the Python
      signature, for the same reason as addRxns.'
  - matlab: checkFileExistence
    status: internal
    reason: File-existence glue with MATLAB dialog prompts.
  - matlab: checkInstallation
    status: internal
    reason: Installation check. Python installs with pip.
  - matlab: checkModelStruct
    python: raven_toolbox.utils.check_model
    status: parity
    scenarios:
      - check_model_struct_smallyeast
    notes: 'from migration.md. Structured curation report. RAVEN''s struct/type checks are moot in cobra. Both
      sides find the same orphan_metabolite, orphan_gene, empty_reaction and objective issues for the same
      entities. checkModelStruct''s own `category` output is not directly comparable to check_model''s: it comes
      from issueCategory(), a fixed elseif chain of substring matches over the free-text message, evaluated in
      one set order regardless of which check produced the message, so two of these four checks land under a
      category name unrelated to what they actually check --- the empty-reaction message is caught by an
      earlier, unrelated `empty_id` branch before ever reaching the branch that would tag it `unused`, and the
      no-objective message is caught by an earlier, unrelated `invalid_id` branch before ever reaching the branch
      that would tag it `objective`. The two orphan checks (metabolite, gene) do reach the same branch, but that
      branch tags both `unused` --- a single shared category, not two distinct ones. The MATLAB side works around
      this by reclassifying each issue from its exact, stable message text into the same four semantic category
      names check_model already uses (empty_reaction / orphan_metabolite / orphan_gene / objective), and compares
      those, never checkModelStruct''s own category strings. SCOPE: only four of checkModelStruct''s categories
      have a counterpart. Most of the rest (missing_field, wrong_type, invalid_bounds, invalid_formula,
      cross_reference, other) check RAVEN-struct properties a cobra.Model cannot even represent invalidly in the
      first place --- cobra enforces unique, non-empty reaction/metabolite/gene ids and real field types at the
      object level. "gpr" is left out despite both sides having something under that name: checkModelStruct''s
      gpr issues are grRule syntax/token problems (a trailing "or", an unparseable rule); raven_toolbox''s own GPR
      linter is find_non_dnf_grrules, a different check (is the rule in DNF) with no row of its own in this
      ledger yet. NOT COMPARABLE: "duplicate" (duplicate metabolite name+compartment) and multiple-objective ---
      RAVEN reports one issue per offending entity (one per duplicate metabolite, one per surplus objective
      reaction), where check_model reports one issue for the whole group with the entity list folded into free
      text and object_id left None.'
  - matlab: checkProduction
    status: via-dependency
    reason: 'cobrapy covers this: analyse_topology plus cobra.flux_analysis.find_blocked_reactions.'
  - matlab: checkRxn
    status: subsumed
    reason: Single-reaction feasibility probe, used inside the gap-analysis entry points.
  - matlab: checkSolution
    status: via-dependency
    reason: 'cobrapy covers this: the Solution object carries status, objective_value and fluxes.'
  - matlab: checkTasks
    python: raven_toolbox.tasks.check_tasks
    status: parity
    scenarios:
      - task_checking_smallyeast
    notes: 'The two set up a task in different ways: checkTasks relaxes the metabolite balance (model.b) for the
      declared inputs and outputs and leaves the model''s own reactions exactly as they are, while check_tasks
      closes the model''s boundary reactions and works through exchange reactions. close_boundaries defaults
      False on both check_tasks and find_task_essential_reactions, reproducing RAVEN''s verdict on all six of
      smallYeast''s tasks without callers having to pass it explicitly. checkTasks warns when the model has no
      ''unconstrained'' field, so RAVEN''s task framework assumes models that keep their exchange *metabolites*,
      which a cobrapy model does not have.'
  - matlab: cleanSheet
    status: subsumed
    reason: Excel cell-cleaning helper; inside io.export_to_excel.
  - matlab: closeModel
    python: raven_toolbox.manipulation.close_model
    status: parity
    scenarios:
      - close_model_smallyeast
    notes: 'Both sides detect the same "unit exchange" reactions by the same rule (sum(|coefficient|) == 1, a
      single-metabolite exchange/sink/demand with unit coefficient) --- eight reactions on smallYeast (acOUT,
      biomassOUT, co2OUT, ethIN, ethOUT, glcIN, glyOUT, o2IN). What each side does to those eight afterwards
      shares no structure at all. closeModel appends a boundary metabolite --- in a new ''b'' compartment --- to
      each one and never writes to lb/ub anywhere in its own source. close_model leaves every metabolite and
      compartment untouched and sets rxn.bounds=(0,0) directly. Despite the different mechanisms, both leave all
      eight reactions unable to carry flux afterwards (minimum and maximum both 0) and both drop maximum growth
      from ~1.2215 to 0 once glucose and oxygen uptake are opened. closeModel.m''s own docstring and body
      describe only a structural addition (new metabolite, new compartment) with no claim about flux, and the
      `unconstrained` flag it sets is not consulted anywhere in RAVEN''s own LP-solving path (only I/O and
      bookkeeping code reads it). The flux effect instead comes from RAVEN''s own LP builder
      (solver/solveLP.m), which solves reaction fluxes and one slack variable per metabolite together, each slack
      bounded by that metabolite''s own model.b entry and pinned by the equality S*v - slack = 0: appending the
      boundary metabolite with model.b = 0 pins its slack to 0, which forces the one reaction touching it to zero
      flux despite that reaction''s own lb/ub being left exactly as they were. NOT COMPARABLE: raw model shape
      after closure --- closeModel adds a metabolite and compartment per closed reaction; close_model does
      not.'
  - matlab: compareFluxes
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#40
    notes: Diagnostic flux comparison across conditions; cobra_raven_comparison.md calls it a practical tool
      COBRA lacks. No port decision is recorded either way. Left in the queue rather than declared a divergence,
      so the choice stays visible.
  - matlab: compareMultipleModels
    python: raven_toolbox.comparison.compare_models
    status: parity
    scenarios:
      - compare_multiple_models_smallyeast
    notes: 'from migration.md. Tidy DataFrames (reactions / mets / genes / subsystems presence + pairwise
      Jaccard + optional check_tasks pass/fail). Plotting and tSNE/MDS are one-liners in seaborn/scikit-learn;
      intentionally not in the function, and structCompMap (RAVEN''s own tSNE/MDS projection) needs the
      Statistics and Machine Learning Toolbox and is skipped when absent --- neither is a fixture either side of
      this parity claim. compareMultipleModels itself works in reaction-space only (its own docstring). THREE
      SCOPE GAPS: (1) compareMultipleModels has no metabolite or gene presence matrix at all --- compare_models''s
      is a strict addition, not a divergence in the shared part. (2) The similarity statistic is not the same
      computation: compareMultipleModels'' structComp is (1 - Hamming distance) = (B''*B + (1-B)''*(1-B)) / nRows,
      counting "both models lack this reaction" as agreement; compare_models'' similarity is Jaccard, counting
      only shared presence. Two models that mostly agree by both lacking most of a big universal reaction set
      score high on one and low on the other. (3) Subsystem handling: compareMultipleModels reads only a
      reaction''s first subsystem ("additional subSystems will be ignored", its own comment) and skips the whole
      subsystem comparison if any input model lacks the field; compare_models joins every subsystem with ";".'
  - matlab: compareRxnsGenesMetsComps
    status: subsumed
    reason: Pairwise entity comparison; comparison.compare_models returns the same information as tidy DataFrames
      for N models.
  - matlab: constructEquations
    status: matlab-only
    reason: reaction.build_reaction_string(use_metabolite_names=...) already does both id and name equations.
    notes: no obvious Python counterpart; decide whether one is needed
  - matlab: constructS
    status: via-dependency
    reason: 'cobrapy covers this: cobra.util.array.create_stoichiometric_matrix.'
  - matlab: consumeSomething
    status: subsumed
    reason: Consumption probe used inside the gap analysis; not a separate Python entry point.
  - matlab: contractModel
    python: raven_toolbox.manipulation.remove_duplicate_reactions
    status: parity
    notes: 'Expand-then-contract is a lossless round trip on both sides. contractModel keeps the FIRST member of
      each duplicate set, strips the _EXP_N suffix (documented behaviour: the model is assumed to have come
      through expandModel) and merges the set''s grRules with "or", so HXK returns with "YCL040W or YFR053C or
      YGL253W". remove_duplicate_reactions does the same: keep=rxns[0], a _merge_gene_reaction_rules helper
      combining every survivor''s top-level OR-clauses (via cobra''s own GPR AST, not hand-rolled bracket
      parsing), and the _EXP_ suffix stripped when every duplicate in the group carries one. Separately, the two
      disagree on what counts as a duplicate: contractModel compares stoichiometry with distReverse, while
      remove_duplicate_reactions also requires identical bounds and objective coefficient. Detection is a
      different function on both sides --- see findDuplicateRxns.'
  - matlab: convertCharArray
    status: internal
    reason: MATLAB argument-validation glue. Python uses ordinary keyword arguments and type hints.
  - matlab: convertToIrrev
    python: raven_toolbox.manipulation.convert_to_irreversible
    status: parity
    scenarios:
      - model_manipulation_smallyeast
    notes: 'Splits every reaction with rev ~= 0, including reversible exchange reactions (neither side
      special-cases them), into forward + _REV. A negative objective coefficient on a split reaction moves
      onto the new reverse reaction (sign-flipped positive) and is zeroed on the forward reaction, on both
      sides.'
  - matlab: copyToComps
    python: raven_toolbox.manipulation.copy_to_compartment
    status: parity
    scenarios:
      - copy_to_compartment_smallyeast
    notes: 'Duplicate reactions into a target compartment. Both leave the originals'' metabolites behind when the
      reactions are moved. NAMING DIVERGES, the same way it does in mergeCompartments: copyToComps appends the
      target compartment to the id a metabolite already has, exactly as its docstring says ("New reactions and
      metabolites will be named as id_toComps(i)"), so ADP_c copied into p becomes ADP_c_p, while
      copy_to_compartment rewrites the suffix and gives ADP_p. Interface also differs: copyToComps takes a list
      of target compartments, copy_to_compartment one.'
  - matlab: curateModelFromTables
    python: raven_toolbox.curation.batch_curate_from_tsv
    status: parity
    notes: Table-driven batch curation.
  - matlab: defaultCompartmentMap
    python: raven_toolbox.localization.DEFAULT_COMPARTMENT_MAP
    status: parity
    notes: 'MATLAB''s containers.Map (built from parallel labels/ids arrays) and the Python dict constant carry
      the same 23 entries, same mapped ids, same declaration order.'
  - matlab: deleteUnusedGenes
    status: via-dependency
    reason: 'cobrapy covers this: cobra.manipulation.prune_unused_genes. raven_toolbox.manipulation.remove_genes
      also covers it.'
  - matlab: deltaGCSV
    python: raven_toolbox.annotation.load_delta_g_csv
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#67
    scenarios:
      - delta_g_csv_smallyeast
    notes: 'The read half; save_delta_g_csv is the write half, and this row is only about the read half ---
      deltaGCSV(model, ''save'', ...) has no ledger row of its own yet. Both match a CSV row to a model id, stamp
      its value, and leave anything the CSV does not mention untouched (RAVEN: metDeltaG/rxnDeltaG
      pre-initialised to NaN and never touched for an unmentioned id; raven_toolbox: entity.notes never gets a
      ''deltaG'' key for one). Both sides recognise yeast-GEM''s "no measurement" sentinel, 10000000.0 (named in
      load_delta_g_csv''s own docstring, which cites yeast-GEM''s checkrxnDirection.m as gating on this exact
      value, true for 777 of yeast-GEM''s 4102 reaction rows): by default, a sentinel-valued row is left
      unstamped on both sides, the same state a genuinely unmentioned id gets. deltaGCSV also takes an opt-in
      missingValue parameter for callers that want the value stamped literally instead, matching
      load_delta_g_csv''s missing_value parameter. NOT THE DIVERGENCE, and not itself compared: where the value
      ends up stored --- RAVEN keeps metDeltaG/rxnDeltaG as numeric array fields on the model struct;
      raven_toolbox stores the same fact as a string on each entity''s own notes[''deltaG''] (cobra has no
      per-entity numeric side-table to put it in). Both are normalised to a plain float (or NaN) before
      comparison, so that representational difference never shows up as one.'
  - matlab: diffModels
    python: raven_toolbox.comparison.diff_models
    status: parity
    scenarios:
      - diff_models_smallyeast
    notes: 'Both compare two models entry by entry keyed by id (reactions, metabolites, genes only-in-A/only-in-B;
      shared reactions'' stoichiometry, bounds, objective and GPR; shared metabolites'' formula, charge and
      compartment), and both compare GPRs as DNF-normalised logic rather than text --- a shared reaction''s
      isozyme order does not count as a difference on either side. NOT COMPARABLE: annotation scope. diffModels
      checks exactly one annotation-like field, eccodes; diff_models checks a much broader
      DEFAULT_ANNOTATION_KEYS set (sbo, kegg.reaction, kegg.compound, metanetx.*, chebi, bigg.reaction, ...)
      across both reactions and metabolites. A chebi or kegg.compound difference on a metabolite would be flagged
      by diff_models and invisible to diffModels. Also structural rather than behavioural: diffModels returns
      rxnsOnlyInA / rxnsOnlyInB / metsOnlyInA / metsOnlyInB / genesOnlyInA / genesOnlyInB as first-class fields;
      DiffReport on the Python side folds the same facts into the free-text differences list only, with no
      structured equivalent.'
  - matlab: downloadGenomeData
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#53
    notes: Fetches genome/proteome files for a reconstruction. No port decision is recorded either way. Left
      in the queue rather than declared a divergence, so the choice stays visible.
  - matlab: editMiriam
    status: matlab-only
    reason: 'cobra''s .annotation is already a {namespace: id(s)} dict — read/write it directly.'
    notes: no obvious Python counterpart; decide whether one is needed
  - matlab: emptyOrLogicalScalar
    status: internal
    reason: MATLAB argument-validation glue. Python uses ordinary keyword arguments and type hints.
  - matlab: emptyOrTextOrCellOfText
    status: internal
    reason: MATLAB argument-validation glue. Python uses ordinary keyword arguments and type hints.
  - matlab: emptyOrTextScalar
    status: internal
    reason: MATLAB argument-validation glue. Python uses ordinary keyword arguments and type hints.
  - matlab: expandModel
    python: raven_toolbox.manipulation.expand_model
    status: parity
    scenarios:
      - model_manipulation_smallyeast
    notes: 'from migration.md. Splits OR-GPR (isozyme) reactions into one per AND-clause. Adopted from geckopy.
      grRules are compared as gene sets rather than as strings --- expandModel ends by calling
      standardizeGrRules, which brackets complexes, while the Python side joins a clause with " and ".'
  - matlab: exportForGit
    python: raven_toolbox.io.export_for_git
    status: parity
    notes: from migration.md. Standard-GEM repo layout (model/<fmt>/…).
  - matlab: exportModel
    status: via-dependency
    reason: 'cobrapy covers this: cobra.io.write_sbml_model.'
  - matlab: exportToExcelFormat
    python: raven_toolbox.io.export_to_excel
    status: parity
    scenarios:
      - export_to_excel_smallyeast
    notes: 'from migration.md. RAVEN 5-sheet xlsx (RXNS / METS / COMPS / GENES / MODEL). Excel import is
      intentionally excluded on both sides. Same sheets, same headers, same column order, including RAVEN''s own
      unusual convention (RXNS'' ID column is the real reaction id, but METS'' ID column is name[comp] with the
      real id moved to REPLACEMENT ID). Bound cells: exportToExcelFormat hides a bound cell that equals the
      model''s own declared default (model.annotation.defaultLB/defaultUB), and separately hides an irreversible
      reaction''s lower bound whenever it is exactly 0, regardless of the declared default. export_to_excel
      replicates the same hiding rule via a _rxn_bound_cells helper. NOT COMPARABLE, and not attempted:
      METS/COMPS/GENES/MODEL sheets, the MIRIAM column''s cross-namespace join order (RAVEN preserves
      editMiriam''s own insertion order; raven_toolbox sorts by namespace --- a real, separate risk on a model
      with more than one MIRIAM namespace per entity), and the ENZYMES/ENZRXNS sheets (GECKO-only, smallYeast has
      no model.ec). Neither side provides a reader for its own export.'
  - matlab: exportToTabDelimited
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#55
    notes: Tab-delimited model export. No port decision is recorded either way. Left in the queue rather than
      declared a divergence, so the choice stays visible.
  - matlab: extractMiriam
    status: matlab-only
    reason: 'cobra''s .annotation is already a {namespace: id(s)} dict — read/write it directly.'
    notes: no obvious Python counterpart; decide whether one is needed
  - matlab: fillGaps
    python: raven_toolbox.gapfilling.connect_blocked_reactions
    status: parity
    scenarios:
      - gapfill_connect_smallyeast
    notes: 'from migration.md. MILP (min penalty-weighted template reactions s.t. blocked reactions carry flux).
      Targeted mode is cobra.gapfill. RAVEN''s default glpk cannot solve a MILP at all; the scenario names SCIP,
      which ships in the RAVEN checkout, so it needs no commercial licence.'
  - matlab: findDuplicateRxns
    python: raven_toolbox.manipulation.find_duplicate_reactions
    status: parity
    scenarios:
      - duplicate_reactions_smallyeast
    notes: 'Detection only --- stoichiometry compared, bounds and GPRs ignored. Return shapes differ: MATLAB
      returns every pairwise combination as reaction indices, Python returns lists of reaction objects; the pairs
      within a set form a clique, so recovering groups from them loses nothing.'
  - matlab: findGeneDeletions
    status: via-dependency
    reason: 'cobrapy covers this: cobra.flux_analysis.single_gene_deletion / double_gene_deletion.'
  - matlab: findLeakMetabolite
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#44
    notes: Finds metabolites produced from nothing (leaks). No port decision is recorded either way. Left
