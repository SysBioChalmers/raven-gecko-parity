  - matlab: assignKcatValues
    python: geckopy.apply_kcat_list
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: 'criteria=''max''/''min'' match exactly (including the shared documented MATLAB-COMPAT choices:
      geckopy lowercases ec.source and appends fuzzy wildcard/origin detail; returns updated reaction ids
      instead of positions). criteria=''median''/''mean'' now also compute correctly on both sides
      (raven-gecko-parity#73): selectKcatValue.m used to request a two-output [selectedKcats(i),j] =
      median(...)/mean(...) call that standard MATLAB median/mean do not support (only max/min do), erroring
      unconditionally on any non-empty kcatList. Fixed to compute the aggregate directly and, like geckopy''s
      apply_kcat_list, attribute ec.source to the first matching kcatList row for both criteria (GECKO#467).'
  - matlab: selectKcatValue
    status: subsumed
    reason: Deprecated alias for assignKcatValues (src/deprecated/selectKcatValue.m); warns with
