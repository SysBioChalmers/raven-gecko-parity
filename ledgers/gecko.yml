    reason: 'geckopy loads databases implicitly at point of use rather than through one entry point. The
      download halves are standalone functions on both sides now (downloadKEGG/downloadUniProt, tracked in
      their own rows), called by loadDatabases only when the expected TSV is missing. Separately: MATLAB''s
      duplicate-UniProt-entry error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already on
      develop3) --- crashes with "Undefined function ''dispEM''" instead of reporting the duplicates.'
  - matlab: loadEcModel
    python: geckopy.load_ec_model
    status: parity
    scenarios:
      - ec_model_io_ectestgem
    notes: '[3->4] auto-flips legacy reverse-direction usage_prot_* / prot_pool_exchange to the forward
      convention on load; the legacy-flip path is not exercised by the scenario, since current makeEcModel
      already writes forward.'
  - matlab: loadFluxData
