      §5.'
  - matlab: readDLKcatOutput
    python: geckopy.read_dlkcat_output
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'Kept as a deliberate divergence in defaults (raven-gecko-parity#76): an unrecognised substrate
      name is still fatal in
      [readDLKcatOutput](https://github.com/SysBioChalmers/GECKO/blob/develop4/src/gather_kcats/readDLKcatOutput.m#L1)
      (aborts the whole read), while
      [read_dlkcat_output](https://github.com/SysBioChalmers/geckopy/blob/main/src/geckopy/gather_kcats/read_dlkcat_output.py#L32)
      drops just that row by default -- but now accepts strict=True to opt into MATLAB''s fail-fast behavior
      (geckopy#44), and reports the non-numeric-kcat and unrecognised-substrate drop counts separately rather
      than conflating them. Substrate-name matching against model.metNames is case-insensitive on both
      sides.'
  - matlab: readOpenKineticsPredictorOutput
    python: geckopy.gather_kcats.open_kinetics_predictor.parse_okp_output
    status: parity
    scenarios:
      - okp_kcat_ectestgem
    notes: 'parse_okp_output does the same sequence->protein / SMILES->metabolite mapping over the same OKP
      output columns (kcat (1/s), Source kcat, Protein Sequence, Substrate) and produces the same kcatList
      shape. DIVERGENCE: MATLAB prefixes each entry''s provenance with "OKP-" (kcatSource, e.g.
      "OKP-CataPro"); parse_okp_output''s `source` column keeps the bare value from Source kcat (e.g.
      "CataPro"), un-prefixed. Mechanism also differs --- MATLAB reads a file the user downloads by hand from
      predictor.openkinetics.org; geckopy''s OKPClient fetches the same CSV shape over REST --- but that
      difference is plumbing, not behaviour.'
