      writeOpenKineticsPredictorInput.m indexed model.ec.rxnEnzMat with a position *within the
      requested ecRxns subset* instead of mapping it back to ec.rxns'' own absolute numbering, so any
      subset excluding an earlier ec.rxns entry (the scenario''s own {R2_EXP_1, R2_EXP_2, R3}, which
      skips the two REV entries in between) silently dropped a later reaction''s enzyme and duplicated
      an earlier one''s instead. Confirmed by direct execution; geckopy''s build_okp_input_csv has no
      equivalent bug. Filed and fixed: [GECKO #437], merged.'
