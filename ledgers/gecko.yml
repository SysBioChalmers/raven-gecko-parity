      - ec_model_full_yeastgem
    notes: 'Both validate each EC string against a strict pattern (four purely-numeric-or-''-'' levels) and
      drop the whole string, including any other valid EC code joined to it, on a single failure ---
      yeast-GEM''s own annotations include real "new/undefined subclass" codes like 1.1.1.n12 that fail this
      pattern.'
