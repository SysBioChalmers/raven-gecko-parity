  - python: raven_toolbox.omics.rna_gene_scores
    status: subsumed
    reason: 'RAVEN has the same computation, but inside scoreModel/scoreComplexModel''s arrayData branch
      rather than as its own entry point: mean-across-tissues reference, aScores = 5*log(current./average),
      clamped to [-5, 10] with NaN mapped to -5 --- the same formula as gene_scores_from_expression, which
      rna_gene_scores is a thin wrapper over. A packaging difference, not a divergence. The wrapper itself
      (reference-threshold defaulting to a per-gene mean TPM, matching arrayData.threshold''s default) is not
      directly covered by a scenario yet, only the computation it delegates to.'
