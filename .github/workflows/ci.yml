name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # The ledgers describe two other repos, so they can go stale without anything
  # happening here. A nightly run is what catches that.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      # The ledgers are written against specific branches, not whatever each repo
      # happens to call its default. RAVEN's default is `main` while the ledger
      # describes `develop3`, so taking defaults would compare a release branch
      # against a development one and report the backlog as drift.
      - id: refs
        run: parity refs --format shell >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: SysBioChalmers/RAVEN
          ref: ${{ steps.refs.outputs.raven_matlab_ref }}
          path: repos/RAVEN
      - uses: actions/checkout@v4
        with:
          repository: SysBioChalmers/raven-toolbox
          ref: ${{ steps.refs.outputs.raven_python_ref }}
          path: repos/raven-toolbox
      - uses: actions/checkout@v4
        with:
          repository: SysBioChalmers/GECKO
          ref: ${{ steps.refs.outputs.gecko_matlab_ref }}
          path: repos/GECKO
      - uses: actions/checkout@v4
        with:
          repository: SysBioChalmers/geckopy
          ref: ${{ steps.refs.outputs.gecko_python_ref }}
          path: repos/geckopy

      - name: Point parity at the checked-out repos
        run: |
          cat > parity.local.toml <<'EOF'
          [pairs.raven.matlab]
          path = "repos/RAVEN"
          [pairs.raven.python]
          path = "repos/raven-toolbox"
          [pairs.gecko.matlab]
          path = "repos/GECKO"
          [pairs.gecko.python]
          path = "repos/geckopy"
          EOF

      # Fails when a public function on either side has no ledger entry, when a row
      # names something that no longer exists, or when a row contradicts itself.
      # Add --strict once the unreviewed count reaches zero.
      - name: Check the ledgers
        run: parity check

      - name: Render the parity reports
        run: parity report -o build/

      - uses: actions/upload-artifact@v4
        with:
          name: parity-reports
          path: build/
