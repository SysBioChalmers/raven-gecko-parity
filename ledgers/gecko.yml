  - matlab: sigmaFitter
    python: geckopy.fit_sigma
    status: parity
    scenarios:
      - sensitivity_tuning_ectestgem
    notes: 'DIVERGENCE, now measured: the fitted sigma value agrees exactly (both sides
      run the same 100-point grid search, geckopy''s fit_sigma called with
      method=''grid'' to match). MATLAB''s own bug: the grid-search loop reassigns
      `model` every iteration, so it returns a model sized for whichever sigma was
      tried last (sigma=1), not the best-fitting one it reports as `sigma` --- contrary
      to its own docstring ("ecModel with protein pool exchange upper bound adapted to
      the optimal sigma-factor"). geckopy''s own MATLAB-COMPAT note already flagged
      this; confirmed here with the actual numbers (sigma 0.11 both sides; MATLAB''s
      returned model pool bound 2000 vs the correct 220 = Ptot*f*0.11*1000). Filed and
      fixed: GECKO #433, merged.'
