# Parity ledger --- gecko
#
# One row per public function on either side. `parity check` fails if a public
# function is missing here, or if a row names something that no longer exists.
#
# status:
#   parity          Both sides implement this and are intended to behave the same.
#   python-pending  MATLAB has it; a Python port is queued.
#   matlab-pending  Python has it; a MATLAB back-port is queued.
#   matlab-only     Deliberately MATLAB-only --- not coming to Python.
#   python-only     Deliberately Python-only --- not going to MATLAB.
#   via-dependency  The other side gets this from a dependency (cobrapy, COBRA Toolbox) instead.
#   subsumed        The other side has the capability inside another function, not as its own entry point.
#   internal        Not part of the cross-implementation API (glue, installers, helpers).
#   unreviewed      Not yet triaged. Drive this count to zero.
#
# Regenerate the human-readable view with: parity report --pair gecko

version: 1
pair: gecko
matlab: SysBioChalmers/GECKO
python: SysBioChalmers/geckopy

entries:
  - matlab: abc_max
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: adapterTemplate
    status: subsumed
    reason: Adapter skeleton generation lives in the `geckopy init` CLI and templates/model_adapter.toml rather
      than in a library function.
  - matlab: fillCarbonNum
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: addCarbonNum
    status: subsumed
    reason: Deprecated alias for fillCarbonNum (src/deprecated/addCarbonNum.m); warns with GECKO:deprecatedName
      and forwards to it. Not a separate function to track.
  - matlab: addNewRxnsToEC
    python: geckopy.add_new_rxns_to_ec
    status: parity
    scenarios:
      - model_edits_ectestgem
    notes: 'Matches geckopy exactly: reactions added, enzymes added, and every field of the resulting model.
      Separately: MATLAB''s missing-gene error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already
      on develop3) --- crashes with "Undefined function ''dispEM''" instead of reporting the missing gene.'
  - matlab: applyComplexData
    python: geckopy.apply_complex_data
    status: parity
    scenarios:
      - enzyme_annotation_ectestgem
  - matlab: applyCustomKcats
    python: geckopy.apply_custom_kcats
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'A mode-A row (reaction id only, no protein listed) now writes ec.source=''custom'' and appends
      ec.notes on both sides (raven-gecko-parity#51): MATLAB used to only write ec.kcat there, silently
      discarding any curator-supplied note rather than leaving it unset. Fixed to mirror the mode-B/C write
      path geckopy already shared across all three modes (GECKO#469).'
  - matlab: applyKcatConstraints
    python: geckopy.apply_kcat_constraints
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: '[3->4] writes coefficients with the forward-direction usage_prot_* / prot_pool_exchange convention.
      In the full formulation, two enzyme rows mapping to the same prot_<accession> metabolite (distinct genes
      sharing one UniProt entry) are summed on both sides. In the light formulation, an isozyme with no usable
      kcat is excluded before selecting the cheapest isozyme on both sides (GECKO#463).'
  - matlab: bayesianSensitivityTuning
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#21
    notes: ABC-SMC kcat tuning (~1370 LOC with its helpers). The migration doc calls it 'not ported', but
      geckopy/docs/internal/bayesian_tuning_plan.md has the design and says the work is paused, not abandoned
      --- queued, not a divergence.
