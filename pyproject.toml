[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raven-gecko-parity"
version = "0.1.0"
description = "Parity ledger and cross-implementation validation for RAVEN/raven-toolbox and GECKO/geckopy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eduard Kerkhoven", email = "eduardk@chalmers.se" },
]

dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
parity = "parity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
