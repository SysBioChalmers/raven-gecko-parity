  - matlab: deltaGCSV
    python: raven_toolbox.annotation.load_delta_g_csv
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#16
    scenarios:
      - delta_g_csv_smallyeast
    notes: 'The read half; save_delta_g_csv is the write half, and this row is only about the read half ---
      deltaGCSV(model, ''save'', ...) has no ledger row of its own yet. DIVERGENCE, confirmed end to end
      (raven-gecko-parity#16) --- FIXED: load_delta_g_csv''s missing_value default flipped from stripping the
      sentinel to None (stamp every value literally, matching deltaGCSV''s own unconditional-copy default);
      deltaGCSV also gained an opt-in missingValue parameter for callers that do want the old stripping
      behaviour, on either side, explicitly. Both sides now agree by default. The account below of the original
      divergence is kept for the record. The ordinary case agrees: both match a CSV row to a model id, stamp its
      value, and
      leave anything the CSV does not mention untouched (RAVEN: metDeltaG/rxnDeltaG pre-initialised to NaN and
      never touched for an unmentioned id; raven_toolbox: entity.notes never gets a ''deltaG'' key for one).
      Where they disagree is yeast-GEM''s own "no measurement" sentinel, 10000000.0 --- named directly in
      load_delta_g_csv''s own docstring, which cites yeast-GEM''s checkrxnDirection.m as gating on this exact
      value, and true for 777 of yeast-GEM''s 4102 reaction rows per that same docstring. deltaGCSV has no concept
      of a sentinel at all: it copies whatever the CSV says for a matched id, verbatim, so a sentinel-valued row
      comes back as the literal number 10000000.0, indistinguishable from a real (if implausible) measurement.
      load_delta_g_csv checks every matched value against exactly this sentinel by default and leaves the entity
      unstamped when it matches, so the same row comes back with no value at all on the Python side --- the same
      state a genuinely unmentioned id gets. Applying the identical CSV to the identical model leaves the two
      sides disagreeing about whether this entity has a ΔG value on record at all, let alone what it is.
      delta_g_csv_smallyeast asserted exactly this split before the fix above; it is green now. NOT THE DIVERGENCE,
      and not itself compared: where the value ends up stored --- RAVEN keeps metDeltaG/rxnDeltaG as numeric array
      fields on the model struct; raven_toolbox stores the same fact as a string on each entity''s own
      notes[''deltaG''] (cobra has no per-entity numeric side-table to put it in, by that module''s own
      docstring). Both are normalised to a plain float (or NaN) before comparison, so that representational
      difference never shows up as one. BUILD NOTE: MATLAB''s jsonencode turns a raw NaN into JSON null, where
      the harness''s Python-side canonicalisation turns a NaN float into the string "NaN" instead, and
      collect_matlab applies no equivalent step to what MATLAB already wrote --- delta_g_csv_smallyeast.m converts
      NaN to the literal string ''NaN'' itself (see its json_safe() helper) rather than relying on jsonencode''s
      default. A shared-harness fix for this (matlab/parity_run.m) has been flagged for separate follow-up rather
      than folded into this scenario.'
