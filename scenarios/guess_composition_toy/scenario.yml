id: guess_composition_toy
pair: raven
description: >-
  guessComposition/guess_composition on a hand-built A -> B -> C chain (A's
  formula known, B and C unknown), a separate A -> 2 D reaction (D's own
  coefficient is 2, so its correct formula is half of A's atom counts), and
  an orphan metabolite with no reactions at all. Exercises the fixed-point
  loop (C only resolves once B has been assigned, in a later pass), the
  "no reactions -> unresolvable" path, and the resolving reaction's own
  coefficient being applied (SysBioChalmers/RAVEN#743, merged): before that
  fix, real RAVEN ignored a resolving coefficient other than +-1 and would
  have guessed D as identical to A (CH4) rather than the correct C0.5H2.

entries:
  - guessComposition

inputs: {}
tolerance:
  rel: 1.0e-9
  abs: 1.0e-9
