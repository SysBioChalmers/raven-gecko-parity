  - matlab: writeDLKcatInput
    python: geckopy.write_dlkcat_input
    status: parity
    scenarios:
      - kcat_chain_ectestgem
  - matlab: writeOpenKineticsPredictorInput
    python: geckopy.gather_kcats.open_kinetics_predictor.build_okp_input_csv
