      wildcard branch''s EC-prefix slice keeps only the character before the dash plus
      the dash itself --- for any "X.Y.Z.-"-shaped wildcard that is always exactly ".-",
      since the dash is always preceded by a dot, so searching BRENDA for the literal
      substring ".-" can never match a real EC code; every wildcard query returns
      nothing. (2) When neither table matches at all, comparing 0 to 0 falls into the
