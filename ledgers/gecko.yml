# Parity ledger --- gecko
#
# One row per public function on either side. `parity check` fails if a public
# function is missing here, or if a row names something that no longer exists.
#
# status:
#   parity          Both sides implement this and are intended to behave the same.
#   python-pending  MATLAB has it; a Python port is queued.
#   matlab-pending  Python has it; a MATLAB back-port is queued.
#   matlab-only     Deliberately MATLAB-only --- not coming to Python.
#   python-only     Deliberately Python-only --- not going to MATLAB.
#   via-dependency  The other side gets this from a dependency (cobrapy, COBRA Toolbox) instead.
#   subsumed        The other side has the capability inside another function, not as its own entry point.
#   internal        Not part of the cross-implementation API (glue, installers, helpers).
#   unreviewed      Not yet triaged. Drive this count to zero.
#
# Regenerate the human-readable view with: parity report --pair gecko

version: 1
pair: gecko
matlab: SysBioChalmers/GECKO
python: SysBioChalmers/geckopy

entries:
  - matlab: abc_max
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: adapterTemplate
    status: subsumed
    reason: Adapter skeleton generation lives in the `geckopy init` CLI and templates/model_adapter.toml rather
      than in a library function.
  - matlab: addCarbonNum
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: addNewRxnsToEC
    python: geckopy.add_new_rxns_to_ec
    status: parity
    scenarios:
      - model_edits_ectestgem
    notes: 'Matches geckopy exactly: reactions added, enzymes added, and every field of the resulting model.
      Separately: MATLAB''s missing-gene error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already
      on develop3) --- crashes with "Undefined function ''dispEM''" instead of reporting the missing gene.'
  - matlab: applyComplexData
    python: geckopy.apply_complex_data
    status: parity
    scenarios:
      - enzyme_annotation_ectestgem
  - matlab: applyCustomKcats
    python: geckopy.apply_custom_kcats
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'DIVERGENCE: for a mode-A row (reaction id only, no protein listed), MATLAB only writes ec.kcat,
      leaving ec.source/ec.notes at whatever they already were; geckopy shares one write path across all
      three modes and always sets source=''custom'' and appends the note. Not documented as a MATLAB-COMPAT
      note upstream.'
  - matlab: applyKcatConstraints
    python: geckopy.apply_kcat_constraints
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: '[3->4] writes coefficients with the forward-direction usage_prot_* / prot_pool_exchange convention.
      DIVERGENCE: in the light-model formulation, when only some isozymes of a reaction have a kcat assigned,
      MATLAB corrects an unassigned isozyme''s Inf cost (MW/0) to 0 before taking min() across isozymes, so the
      fabricated zero always wins --- silently writing a zero enzyme cost for the whole reaction even though
      another isozyme has a real, valid kcat. geckopy skips invalid isozymes before the comparison instead,
      correctly picking the real one. In the full formulation, two enzyme rows mapping to the same
      prot_<accession> metabolite (distinct genes sharing one UniProt entry) are summed on both sides.'
  - matlab: bayesianSensitivityTuning
    status: python-pending
    issue: SysBioChalmers/raven-gecko-parity#21
    notes: ABC-SMC kcat tuning (~1370 LOC with its helpers). The migration doc calls it 'not ported', but
      geckopy/docs/internal/bayesian_tuning_plan.md has the design and says the work is paused, not abandoned
      --- queued, not a divergence.
  - matlab: calculateFfactor
    python: geckopy.calculate_f_factor
    status: parity
    scenarios:
      - protein_pool_ectestgem
  - matlab: calculateMW
    python: geckopy.calculate_mw
    status: parity
    scenarios:
      - molecular_weight_sequences
    notes: 'Both agree on the twenty standard residues to the gram-mole. Four differences: the water-mass
      constant (18 vs 18.01528); X''s mass (126.50, an unsourced historical constant, vs the live mean of the
      standard table, 118.885); B''s mass (114.60 pre-rounded vs 114.595 computed); and shape --- calculateMW
      is case-sensitive (a lowercase letter is ignored, like a digit) and returns 18 for a sequence with no
      recognised residues, where calculate_mw upper-cases first and returns NaN for the same case.'
  - matlab: constrainEnzConcs
    python: geckopy.constrain_enz_concs
    status: parity
    scenarios:
      - protein_pool_ectestgem
  - matlab: constrainFluxData
    python: geckopy.apply_flux_data_constraints
    status: parity
    scenarios:
      - flexibilize_concs_ectestgem
    notes: 'geckopy''s own MATLAB-COMPAT note flags RAVEN''s setParam(''var'', ...) as a "soft slack-variable
      formulation" that might not match apply_flux_data_constraints''s hard lb/ub set for the percentage mode
      --- but RAVEN''s ''var'' case just sets lb/ub with the same sign-aware arithmetic geckopy uses, no
      separate slack variable.'
  - matlab: copyECtoGEM
    python: geckopy.copy_ec_to_gem
    status: parity
    scenarios:
      - model_edits_ectestgem
    notes: 'DIVERGENCE: filling an empty eccode and leaving a populated one alone under overwrite=false match
      on both sides. Under overwrite=true, MATLAB clobbers an existing annotation with an empty ec.eccodes
      entry; geckopy treats an empty entry as nothing to propagate and never clobbers with emptiness.'
  - matlab: ecFSEOF
    python: geckopy.ec_fseof
    status: parity
    scenarios:
      - ec_fseof_ectestgem
    notes: '[Py] thin wrapper over raven_toolbox.analysis.fseof; selection is regression-based.
      DIVERGENCE on every axis: (1) the enforced-flux levels themselves differ before any target selection
      happens --- MATLAB''s alpha runs from the biomass-optimal production flux to 90% of the theoretical max,
      raven-toolbox''s levels run from target_max/n_steps to target_max with no reference to the
      biomass-optimal point at all; (2) MATLAB restricts the target search space to gene-associated reactions
      only, raven-toolbox''s classifier considers every reaction; (3) even on the same candidates the
      selection criterion differs --- MATLAB requires strict monotonicity across every step plus a
      top-quartile-by-slope cut, raven-toolbox uses a correlation+slope regression threshold (its own
      IMPROVEMENTS notes FS1-FS4). On ecTestGEM: MATLAB finds 1 target, geckopy finds 6. This is the same
      divergence recorded on the RAVEN pair for FSEOF vs raven_toolbox.analysis.fseof, carried through the
      ecModel-specific wrappers on both sides too. Output shape differs further: MATLAB additionally computes
      a per-gene essentiality column and splits rxnTargets from transportTargets; geckopy''s ec_fseof does
      neither.'
  - matlab: ecFVA
    python: geckopy.ec_fva
    status: parity
    scenarios:
      - ec_fva_ectestgem
    notes: 'DIVERGENCE: every reaction with a single enzyme (or none) agrees exactly; an isozyme-split reaction
      does not. MATLAB reduces each ec-reaction''s own bound with min/max across every canonical group''s solve
      first, then sums forward and subtracts reverse (the "envelope") --- a canonical group''s forward and
      reverse variants can each be reduced against a different combination of the other, not necessarily one
      jointly achievable in any single feasible flux distribution. geckopy instead reads the combined
      forward-minus-reverse value directly off the one solve that actually optimised it (the "diagonal",
      geckopy''s own MATLAB-COMPAT note in ec_fva.py), always a value some feasible distribution attains.'
  - matlab: enzymeUsage
    python: geckopy.enzyme_usage
    status: parity
    scenarios:
      - enzyme_usage_ectestgem
    notes: '[3->4] usage flux read from positive usage_prot_* flux.'
  - matlab: fillEnzConcs
    python: geckopy.fill_enz_concs
    status: parity
    scenarios:
      - protein_pool_ectestgem
  - matlab: findECInDB
    python: geckopy.find_ec_in_db
    status: parity
  - matlab: findGECKOroot
    status: internal
    reason: Path helper. pathlib.Path(__file__) covers it; nothing to port.
  - matlab: findMaxValue
    python: geckopy.find_max_value
    status: parity
    scenarios:
      - sensitivity_tuning_ectestgem
    notes: 'DIVERGENCE in a function with no callers anywhere in GECKO --- documented rather than fixed, the
      same judgment call kcat_chain_ectestgem made for selectKcatValue''s dead ''median'' branch. (1) The
      wildcard branch''s EC-prefix slice keeps only the character before the dash plus the dash itself --- for
      any "X.Y.Z.-"-shaped wildcard that is always exactly ".-", since the dash is always preceded by a dot,
      so searching BRENDA for the literal substring ".-" can never match a real EC code; every wildcard query
      returns nothing. (2) When neither table matches at all, comparing 0 to 0 falls into the "SA won" branch
      and labels the empty result ''SA*Mw'' instead of leaving the parameter blank.'
  - matlab: findMetSmiles
    python: geckopy.find_met_smiles
    status: parity
    scenarios:
      - okp_kcat_ectestgem
  - matlab: flexibilizeEnzConcs
    python: geckopy.flexibilize_enz_concs
    status: parity
    scenarios:
      - flexibilize_concs_ectestgem
    notes: 'DIVERGENCE in the post-loop refinement pass only: the iterative loop itself agrees exactly.
      MATLAB''s refinement solve pins growth into a narrow band around expGrowth (RAVEN''s setParam(''var'',
      bioRxn, expGrowth, 0.5), +/-0.25%) and, minimising protein-pool usage, settles at the band''s low edge
      rather than at expGrowth itself; geckopy''s refinement solve pins growth to exp_growth exactly (a
      deliberate MATLAB-COMPAT choice documented in flexibilize_enz_concs.py). The flexed concentration and
      final growth rate differ by a small, fully explained amount.'
  - matlab: fuzzyKcatMatching
    python: geckopy.fuzzy_kcat_matching
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: 'The search-order/origin-numbering question is settled, not a divergence --- see
      docs/brenda-search-order.md. The wildcard EC search matches by prefix (not substring) on both sides.
      An EC class with zero BRENDA coverage even at full wildcard (''-.-.-.-'') is handled cleanly on both
      sides, returning a "no match" sentinel rather than crashing.'
  - matlab: GECKOInstaller
    status: internal
    reason: Installer. Python installs with pip.
  - matlab: getComplexData
    python: geckopy.get_complex_data
    status: parity
  - matlab: getConcControlCoeffs
    python: geckopy.get_conc_control_coeffs
    status: parity
    scenarios:
      - enzyme_usage_ectestgem
    notes: 'geckopy''s own MATLAB-COMPAT note documents a real algorithmic difference: MATLAB always runs a 2x
      finite-difference probe, geckopy''s default instead reads the LP shadow price of the binding prot_<id>
      constraint, which can differ from the probe by up to 4x at an LP active-set breakpoint.'
  - matlab: getECfromDatabase
    python: geckopy.fill_eccodes_from_database
    status: parity
    scenarios:
      - enzyme_annotation_ectestgem
  - matlab: getECfromGEM
    python: geckopy.fill_eccodes_from_gem
    status: parity
    scenarios:
      - enzyme_annotation_ectestgem
      - ec_model_full_yeastgem
    notes: 'Both validate each EC string against a strict pattern (four purely-numeric-or-''-'' levels) and
      drop the whole string, including any other valid EC code joined to it, on a single failure ---
      yeast-GEM''s own annotations include real "new/undefined subclass" codes like 1.1.1.n12 that fail this
      pattern.'
  - matlab: getECstring
    status: subsumed
    reason: EC-string formatting, inlined on the Python side inside fill_eccodes_from_database and fill_eccodes_from_gem.
      geckopy docs/migrating_from_gecko_matlab.md §5.
  - matlab: getKcatAcrossIsozymes
    python: geckopy.fill_kcats_from_isozymes
    status: parity
    scenarios:
      - kcat_chain_ectestgem
  - matlab: getReactionsFromEnzyme
    python: geckopy.get_reactions_from_enzyme
    status: parity
    scenarios:
      - model_edits_ectestgem
    notes: 'DIVERGENCE: MATLAB matches protein ids case-insensitively and returns empty outputs for an unknown
      one; geckopy is case-sensitive and raises ValueError for both an unknown id and a case-mismatched known
      one.'
  - matlab: getrSample
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: getStandardKcat
    python: geckopy.assign_standard_kcat
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'DIVERGENCE, on the code path a subSystems-carrying model reaches, not exercised by the ecTestGEM
      fixture (which has none): the per-subsystem kcat aggregation is the arithmetic mean in MATLAB and the
      median in geckopy (deliberate on the Python side --- kcats span orders of magnitude and a mean is
      dominated by the largest member), a >100x difference on a skewed sample. The reaction count used for
      the subsystem''s own >=threshold eligibility check also differs: MATLAB counts every mapped ec.rxns row
      including zero/NaN-kcat ones, geckopy counts only already-nonzero ones, so the two sides can take
      different branches (subsystem-specific vs. global fallback) for the same input. Neither is flagged as a
      MATLAB-COMPAT note upstream. Also: fillZeroKcat/fill_zero_kcat treats a NaN kcat as unset in MATLAB but
      not in geckopy (geckopy only treats literal 0 as unset) --- undocumented, not exercised by ecTestGEM
      either.'
  - matlab: getSubsetEcModel
    python: geckopy.get_subset_ec_model
    status: parity
    notes: '[Py] returns a new EcModel; the input is not mutated. MATLAB''s same-starting-GEM mismatch
      error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already on develop3) --- crashes with
      "Undefined function ''dispEM''" instead of naming the mismatched reactions.'
  - matlab: loadBayesianData
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: loadBRENDAdata
    python: geckopy.load_brenda_data
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'MATLAB uses kcat.tsv/mw.tsv/sa.tsv, the same filenames and format geckopy''s own brenda-refresh
      CLI produces and ships in geckopy''s src/geckopy/data/brenda/, so pointing both toolboxes'' BRENDA
      folder at the same directory works. Not ported: the opt-in median aggregation geckopy''s
      load_brenda_data exposes via adapter.params.kcat_aggregate_brenda --- MATLAB still uses the max column
      only.'
  - matlab: loadConventionalGEM
    python: geckopy.load_conventional_gem
    status: parity
    scenarios:
      - ec_model_expansion_ectestgem
  - matlab: loadDatabases
    status: subsumed
    reason: 'geckopy loads databases implicitly at point of use rather than through one entry point. The
      download halves are standalone functions on both sides now (downloadKEGG/downloadUniProt, tracked in
      their own rows), called by loadDatabases only when the expected TSV is missing. Separately: MATLAB''s
      duplicate-UniProt-entry error path calls dispEM, a RAVEN utility RAVEN#659 deleted (already on
      develop3) --- crashes with "Undefined function ''dispEM''" instead of reporting the duplicates.'
  - matlab: loadEcModel
    python: geckopy.load_ec_model
    status: parity
    scenarios:
      - ec_model_io_ectestgem
    notes: '[3->4] auto-flips legacy reverse-direction usage_prot_* / prot_pool_exchange to the forward
      convention on load; the legacy-flip path is not exercised by the scenario, since current makeEcModel
      already writes forward.'
  - matlab: loadFluxData
    python: geckopy.load_flux_data
    status: parity
    scenarios:
      - flexibilize_concs_ectestgem
  - matlab: loadProtData
    python: geckopy.load_prot_data
    status: parity
    scenarios:
      - protein_pool_ectestgem
  - matlab: makeEcModel
    python: geckopy.make_ec_model
    status: parity
    scenarios:
      - ec_model_expansion_ectestgem
      - ec_model_full_yeastgem
    notes: '[3->4] ec.genes/enzymes/mw/sequence sorted alphabetically for stable order on both sides. KEGG
      fallback for unmatched genes (opt-in via kegg_db= on the Python side) is also ported to makeEcModel.m
      stage 7: a gene UniProt can''t match falls back to databases.kegg for MW/sequence/accession (or the
      bare KEGG gene id, when the KEGG row itself has no UniProt accession) instead of getting no enzyme data
      at all. ModelAdapter gains getKeggCompatibleGenes, matching Python''s adapter.get_kegg_compatible_genes.
      [Py] single return; unmatched genes logged and annotated on rxn.notes[''geckopy_warning'']. Both expand
      yeast-GEM''s 4102 conventional reactions to 4671 ec.rxns identically.'
  - matlab: mapRxnsToConv
    python: geckopy.map_rxns_to_conv
    status: parity
    scenarios:
      - model_edits_ectestgem
  - matlab: mergeDLKcatAndFuzzyKcats
    status: internal
    reason: Deprecated thin wrapper around mergeKcats, kept for the legacy two-input call shape and emitting
      a deprecation warning. The canonical name carries the parity row.
  - matlab: mergeKcats
    python: geckopy.merge_kcats
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'Matching three tier tokens (database_exact/database_top/database_bottom), matching default
      database source set (brenda, sabio_rk), matching source-label normalisation to lowercase snake_case.'
  - matlab: ModelAdapter
    python: geckopy.ModelAdapter
    status: parity
    scenarios:
      - ec_model_expansion_ectestgem
  - matlab: ModelAdapterManager
    status: matlab-only
    reason: 'Deliberate design divergence: geckopy has no global default adapter. Pass adapter= explicitly
      or set model.adapter, so there is no manager to port.'
  - matlab: mse
    status: internal
    reason: Helper of bayesianSensitivityTuning, not a standalone entry point. It will be absorbed into the
      Python port rather than getting a counterpart of its own.
  - matlab: parseGECKOargs
    status: internal
    reason: MATLAB varargin parsing glue. Python uses ordinary keyword arguments.
  - matlab: plotEcFVA
    status: matlab-only
    reason: 'Not ported: plot directly from the ec_fva DataFrame with matplotlib or seaborn. geckopy docs/migrating_from_gecko_matlab.md
      §5.'
  - matlab: readDLKcatOutput
    python: geckopy.read_dlkcat_output
    status: parity
    scenarios:
      - kcat_chain_ectestgem
    notes: 'DIVERGENCE: an unrecognised substrate name is fatal in MATLAB (aborts the whole read, even for a
      row whose kcat would otherwise be filtered out) but a non-fatal per-row drop in geckopy.
      Substrate-name matching against model.metNames is case-insensitive on both sides. Separately: both of
      MATLAB''s "not found" error paths (substrates, reactions) call dispEM, a RAVEN utility RAVEN#659
      deleted (already on develop3) --- crash with "Undefined function ''dispEM''" instead of reporting the
      unrecognised names.'
  - matlab: readOpenKineticsPredictorOutput
    python: geckopy.gather_kcats.open_kinetics_predictor.parse_okp_output
    status: parity
    scenarios:
      - okp_kcat_ectestgem
    notes: 'parse_okp_output does the same sequence->protein / SMILES->metabolite mapping over the same OKP
      output columns (kcat (1/s), Source kcat, Protein Sequence, Substrate) and produces the same kcatList
      shape. DIVERGENCE: MATLAB prefixes each entry''s provenance with "OKP-" (kcatSource, e.g.
      "OKP-CataPro"); parse_okp_output''s `source` column keeps the bare value from Source kcat (e.g.
      "CataPro"), un-prefixed. Mechanism also differs --- MATLAB reads a file the user downloads by hand from
      predictor.openkinetics.org; geckopy''s OKPClient fetches the same CSV shape over REST --- but that
      difference is plumbing, not behaviour.'
  - matlab: removeStandardKcat
    python: geckopy.remove_standard_kcat
    status: parity
    scenarios:
      - kcat_chain_ectestgem
  - matlab: reportEnzymeUsage
    python: geckopy.report_enzyme_usage
    status: parity
    scenarios:
      - enzyme_usage_ectestgem
    notes: '[3->4] reads positive usage_prot_* flux. DIVERGENCE: highCapUsage agrees exactly, but
      topAbsUsage''s row count can differ. reportEnzymeUsage.m always returns exactly topAbsUsage rows ---
      an enzyme with no flux-carrying reaction still gets a placeholder row, since isscalar(find(carriedFlux))
      is false for zero matches, the same branch a genuinely multi-reaction enzyme takes.
      report_enzyme_usage instead skips any enzyme with no flux-carrying reaction outright, so it can return
      fewer rows than requested. Not yet fixed on either side, since which behaviour is "correct" is a real
      design question.'
  - matlab: runDLKcat
    python: geckopy.run_dlkcat
    status: parity
  - matlab: saveEcModel
    python: geckopy.save_ec_model
    status: parity
    scenarios:
      - ec_model_io_ectestgem
    notes: '[3->4] emits the new cobrapy-style YAML; usage_prot_* in forward convention. A thin wrapper over
      writeYAMLmodel / write_yaml_model, so content and layout both match.'
  - matlab: selectKcatValue
    python: geckopy.apply_kcat_list
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
    notes: 'DIVERGENCE: criteria=''max''/''min'' match exactly (including the shared documented MATLAB-COMPAT
      choices: geckopy lowercases ec.source and appends fuzzy wildcard/origin detail; returns updated reaction
      ids instead of positions). criteria=''median''/''mean'' are dead code in MATLAB --- selectKcatValue.m
      computes [selectedKcats(i),j] = median(...)/mean(...), a two-output call standard MATLAB median/mean do
      not support (only max/min do), so it errors unconditionally with "Too many output arguments" on any
      non-empty kcatList. GECKO''s own test/VerificationMatrix.tsv already flags this function as under-tested
      (''we did not test all possible parameterizations here''), and no call site anywhere in the codebase,
      including the function''s own docstring example, ever passes criteria=''median''/''mean''. geckopy''s
      apply_kcat_list has no such restriction and computes both correctly.'
  - matlab: sensitivityTuning
    python: geckopy.sensitivity_tuning
    status: parity
    scenarios:
      - sensitivity_tuning_ectestgem
    notes: 'Both pick usage/pool reactions via the forward-direction convention (usage/pool reactions were
      switched to forward in GECKO#419): MATLAB reads max(drawFluxes), the same choice geckopy makes.
      geckopy''s own MATLAB-COMPAT note describing MATLAB as picking the reverse-direction usage reaction with
      the most negative flux is stale relative to current MATLAB code.'
  - matlab: setKcatForReactions
    python: geckopy.set_kcat_for_reactions
    status: parity
    scenarios:
      - model_edits_ectestgem
    notes: 'DIVERGENCE: kcat values match exactly for a suffixed id and for a base name broadcasting one
      scalar across its isozymes. Two differences: ec.source reads ''setKcatForReactions'' in MATLAB,
      ''manual'' in geckopy; and MATLAB accepts a per-isozyme kcat list for an unsuffixed base name (relying
      on ec.rxns order), which geckopy refuses, asking for the suffixed ids explicitly instead.'
  - matlab: setProtPoolSize
    python: geckopy.set_prot_pool_size
    status: parity
    scenarios:
      - protein_pool_ectestgem
      - ec_model_full_yeastgem
    notes: Both adapters' own f value can differ (they carry different defaults, neither wrong); the pool
      bound formula agrees.
  - matlab: sigmaFitter
    python: geckopy.fit_sigma
    status: parity
    scenarios:
      - sensitivity_tuning_ectestgem
    notes: 'The fitted sigma value agrees exactly on both sides (both run the same 100-point grid search;
      geckopy''s fit_sigma called with method=''grid'' to match).'
