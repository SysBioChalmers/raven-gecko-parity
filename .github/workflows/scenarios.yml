name: scenarios

# Cross-implementation behaviour tests. The Python side runs on every change; the MATLAB
# side needs a licence, so it runs on a schedule and on demand rather than per-PR.
#
# matlab-actions/setup-matlab is licence-free for public repositories.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario id (blank = all)"
        required: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: SysBioChalmers/RAVEN, path: repos/RAVEN }
      - uses: actions/checkout@v4
        with: { repository: SysBioChalmers/raven-toolbox, path: repos/raven-toolbox }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . ./repos/raven-toolbox

      - name: Point parity at the checked-out repos
        run: |
          cat > parity.local.toml <<'EOF'
          [pairs.raven.matlab]
          path = "repos/RAVEN"
          [pairs.raven.python]
          path = "repos/raven-toolbox"
          EOF

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Run and compare every scenario
        run: |
          failed=0
          for id in $(parity scenarios --pair raven | awk 'NR % 2 == 1 {print $1}'); do
            if [ -n "${{ inputs.scenario }}" ] && [ "$id" != "${{ inputs.scenario }}" ]; then
              continue
            fi
            echo "::group::$id"
            parity run "$id" --impl python
            parity run "$id" --impl matlab
            parity compare "results/python/$id.json" "results/matlab/$id.json" --scenario "$id" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-results
          path: results/
