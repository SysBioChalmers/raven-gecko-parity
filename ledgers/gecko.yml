    python: geckopy.calculate_f_factor
    status: parity
    scenarios:
      - protein_pool_ectestgem
  - matlab: calculateMW
    python: geckopy.calculate_mw
    status: parity
    scenarios:
      - molecular_weight_sequences
  - matlab: constrainEnzConcs
    python: geckopy.constrain_enz_concs
