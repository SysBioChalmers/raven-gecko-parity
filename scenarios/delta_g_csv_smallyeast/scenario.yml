id: delta_g_csv_smallyeast
pair: raven
description: >-
  Loading a two-column ΔG side-car CSV onto a model --- matching, leaving
  the rest untouched, and, deliberately, one entry using yeast-GEM's own
  "no measurement" sentinel value, which both RAVEN and raven-toolbox
  currently store as a literal number by default.

entries:
  - loadDeltaGCSV

inputs:
  model: "{matlab_repo}/tutorial/smallYeast.yml"

  # Both files use "Var1"/"Var2" headers --- MATLAB's own array2table
  # default column names, and raven_toolbox's own stated default, chosen
  # specifically to match --- so the same two CSVs are read correctly by
  # both sides' own column conventions (RAVEN by position: whatever its
  # first two columns are named; raven_toolbox by name: literally
  # "Var1"/"Var2"). One real id per file gets an ordinary value (MAL_m,
  # PGI), one gets yeast-GEM's 10000000.0 "no measurement" sentinel
  # (AKG_m, HXK), and one id that is not in the model at all is included
  # as harmless noise a CSV commonly carries (NOTAMET_xyz, NOTARXN_xyz)
  # --- neither side errors on an unmatched CSV row; both simply never
  # look it up, since each walks its own model's ids and checks the CSV,
  # not the other way around.
  met_csv: "met_deltag.csv"
  rxn_csv: "rxn_deltag.csv"

  # MAL_m/PGI: ordinary matched value. AKG_m/HXK: the sentinel. GLC_c/ACO:
  # mentioned in neither CSV, to confirm both sides leave an unmentioned
  # entity alone rather than defaulting it to something else.
  met_ids: [MAL_m, AKG_m, GLC_c]
  rxn_ids: [PGI, HXK, ACO]

# loadDeltaGCSV and load_delta_g_csv agree on the ordinary case: MAL_m and
# PGI come back with their CSV value on both sides, GLC_c and ACO come back
# with no value on both sides (RAVEN: metDeltaG/rxnDeltaG pre-initialised to
# NaN and never touched for an id the CSV doesn't mention; raven_toolbox:
# entity.notes has no 'deltaG' key to begin with and load_delta_g_csv never
# sets one). Both are reported here as NaN --- the harness's own
# canonicalisation turns a NaN float into the string "NaN" on either side,
# so "no value" compares equal without this scenario needing a separate
# has-value flag.
#
# AKG_m and HXK carry yeast-GEM's own "no measurement" sentinel (10000000.0
# --- named directly in load_delta_g_csv's own docstring, which cites
# yeast-GEM's checkrxnDirection.m gating on this exact value). Both sides
# currently store it exactly as written by default, rather than treating it
# as absent, so AKG_m/HXK come back as the literal number 10000000.0 on
# both sides --- indistinguishable from a real (if implausible)
# measurement. This was a real divergence at one point: RAVEN's old
# deltaGCSV (removed by RAVEN#719, which split it into
# loadDeltaGCSV/saveDeltaGCSV) took an opt-in missingValue argument that
# filtered the sentinel by default, while load_delta_g_csv's own
# missing_value argument defaults to None (raven-toolbox#102). loadDeltaGCSV
# has no such argument at all: every matched value is stored literally,
# unconditionally. load_delta_g_csv still carries missing_value as an
# opt-in for callers who want the old filtering behaviour
# (raven-toolbox#119, open, proposes removing it outright to match), but
# this scenario never passes it, so the two current defaults ---
# unconditional-literal and opt-in-but-unused --- agree.
#
# NOT COMPARABLE, and not itself compared: where the value ends up stored.
# RAVEN keeps metDeltaG/rxnDeltaG as numeric array fields on the model
# struct; raven_toolbox stores the same fact as a string on each entity's
# own notes['deltaG'] (cobra has no per-entity numeric side-table to put it
# in, and the module's own docstring says as much). Both are normalised to
# a plain float (or NaN) before comparison here, so that representational
# difference never shows up as one.
#
# NOT ATTEMPTED: saveDeltaGCSV / save_delta_g_csv (the write half; see
# save_delta_g_csv_smallyeast for that side), and verbose output on either
# side, which is prose, not a fact.

tolerance:
  # AKG_m/HXK's sentinel is stored verbatim by both sides and compared
  # exactly; the ordinary values (MAL_m, PGI) are hand-typed floats read
  # back through readtable/pandas, not solver output, so exact-enough is
  # exact.
  rel: 0.0
  abs: 1.0e-9
