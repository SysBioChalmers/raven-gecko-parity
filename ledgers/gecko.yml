    notes: 'Confirmed against geckopy docs/migrating_from_gecko_matlab.md §5, and now
      behaviourally by execution: same reaction/enzyme tuned (R3/P4), the same old and
      new kcat, on both sides. geckopy''s own MATLAB-COMPAT note describes MATLAB as
      picking the reverse-direction usage reaction with the most negative flux --- stale
      relative to the develop4 this scenario runs against: usage/pool reactions were
      switched to the forward direction in GECKO#419, after which MATLAB''s own code
      already reads max(drawFluxes), the same choice geckopy makes. Confirmed matching
      by direct execution, not merely by re-reading both sources.'
  - matlab: setKcatForReactions
