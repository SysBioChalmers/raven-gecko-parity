    notes: 'Confirmed against geckopy docs/migrating_from_gecko_matlab.md §5. DIVERGENCE, now measured: for
      a mode-A row (reaction id only, no protein listed), MATLAB only writes ec.kcat, leaving ec.source/ec.notes
