  - matlab: writeYAMLmodel
    python: raven_toolbox.io.write_yaml_model
    status: parity
    issue: SysBioChalmers/raven-gecko-parity#6
    scenarios:
      - yaml_roundtrip_smallyeast
    notes: 'DIVERGENCE in layout, not in content. Both writers preserve the model --- a read-write-read round
      trip is lossless on either side, and the models the two produce agree field for field --- but they do not
      write the same file, so the byte-stability writeYAMLmodel.m claims in its own docstring does not hold
      today. writeYAMLmodel reproduces the historical RAVEN layout (4-space sequence indent, long scalars inline
      in double quotes) and emits an empty "version:" line into metaData; write_yaml_model dumps through cobra''s
      ruamel instance at its defaults (2-space indent, scalars folded at 80 columns) and quotes the date. On
      smallYeast that is 1415 lines against 1571. Asserted by yaml_roundtrip_smallyeast, which compares the two
      written files line by line. Analysed in docs/yaml-reconciliation.md, which also records that
      readYAMLmodel cannot read cobrapy-written YAML at all --- a separate and larger problem than the layout.'
